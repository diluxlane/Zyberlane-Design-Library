name: Build authorized Magicinmybones separate previews

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - data/sources/magicinmybones.json
      - scripts/build-authorized-separate-previews.mjs
      - .github/workflows/build-magicinmybones-separate-previews.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out library
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build isolated authorized previews
        run: node scripts/build-authorized-separate-previews.mjs data/sources/magicinmybones.json hosted/magicinmybones

      - name: Validate main library build
        run: |
          npm test
          npm run build

      - name: Commit generated preview folders and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hosted/magicinmybones docs/magicinmybones-separate-build-results.json
          if git diff --cached --quiet; then
            echo "No preview changes."
            exit 0
          fi
          git commit -m "build: add authorized Magicinmybones separate previews"
          git push origin HEAD:main
