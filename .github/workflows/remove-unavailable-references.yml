name: Remove unavailable references

on:
  push:
    branches:
      - codex/remove-unavailable-references-20261027
    paths:
      - scripts/remove-five-unavailable-references.mjs
      - .github/workflows/remove-unavailable-references.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/remove-unavailable-references-20261027
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Remove references
        run: node scripts/remove-five-unavailable-references.mjs
      - name: Validate
        run: |
          npm test
          npm run build
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/remove-unavailable-references.yml scripts/remove-five-unavailable-references.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Remove unavailable references from design library"
          git push origin HEAD:codex/remove-unavailable-references-20261027
