name: Audit external design reference sources

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - data/source-profiles.json
      - scripts/audit-source-profile.mjs
      - .github/workflows/audit-reference-sources.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out library
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Audit Magicinmybones repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/audit-source-profile.mjs Magicinmybones

      - name: Commit audited catalogue source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources/magicinmybones.json
          if git diff --cached --quiet; then
            echo "No audit changes."
            exit 0
          fi
          git commit -m "data: audit Magicinmybones design references"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
