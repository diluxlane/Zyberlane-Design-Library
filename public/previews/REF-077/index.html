/* ==========================================================================
   Reference canvas: 1053 x 657.  Every number below is a measured pixel
   value from that reference, multiplied by the uniform scale --s.
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}

:root{
  --s: clamp(0.72px, min(100vw / 1053, 100vh / 657), 1.55px);
  --ink:#04070F;             /* page background, sampled #04070F            */
  --title-src:url(assets/images/title.webp);
  --hero-x:15;             /* hero inset left/right                       */
  --hero-y:78;             /* hero top edge (header band = 78px)          */
}
/* Desktop holds until nav type would fall below ~11.5px, which happens at
   900px. iPad Pro portrait (1024) therefore stays on desktop. */
@media (max-width:900px){
  :root{ --s: clamp(0.62px, min(100vw / 470, 100vh / 860), 1.45px); }
}
/* Below 420px the subtitle - the one nowrap line the composition is chained
   to - falls under 13.5px (13.5 at 412, 12.8 at 390). That is the mobile
   breaking point, so 428/430 phones stay on the tablet architecture. */
@media (max-width:420px){
  :root{ --s: clamp(0.6px, min(100vw / 460, 100vh / 900), 1px); }
}

body{
  background:var(--ink);
  color:#fff;
  height:100dvh;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:geometricPrecision;
}
.screen{position:relative;width:100%;height:100dvh;overflow:hidden}

/* ---------------------------------------------------------------- header */
.topbar{
  position:absolute;inset:0 0 auto 0;
  height:calc(var(--hero-y) * var(--s));
  z-index:5;
}
.brand{
  position:absolute;
  left:calc(44 * var(--s));
  top:calc(14 * var(--s));
  display:flex;align-items:flex-start;text-decoration:none;
}
.brand-mark{
  width:calc(29 * var(--s));height:calc(37 * var(--s));
  display:block;image-rendering:pixelated;
}
.brand-word{
  position:absolute;
  left:calc(36 * var(--s));
  top:calc(8 * var(--s));
  font-family:'Pixel Display';font-weight:700;
  font-size:calc(23.4 * var(--s));
  letter-spacing:calc(-0.65 * var(--s));
  line-height:1;white-space:nowrap;color:#fff;
}
.navlink{

  display:flex;align-items:center;
  gap:calc(10 * var(--s));
  padding:0;margin:0;border:0;background:none;cursor:pointer;
  font-family:'UI';font-weight:500;
  font-size:calc(13.45 * var(--s));
  letter-spacing:calc(-0.06 * var(--s));
  line-height:1;white-space:nowrap;color:#C6C8CE;
}
.navlink:hover{color:#fff}
.chev{
  width:calc(11 * var(--s));height:calc(7 * var(--s));
  flex:none;fill:#9BA2B0;stroke:none;
  shape-rendering:crispEdges;
}

  top:calc(28 * var(--s));
  width:calc(18 * var(--s));height:calc(18 * var(--s));
  padding:0;border:0;background:none;cursor:pointer;
}
.searchbtn svg{width:100%;height:100%;display:block;
  fill:#98A3B5;stroke:none;shape-rendering:geometricPrecision}

/* ------------------------------------------------------------------ hero */
.hero{
  position:absolute;
  left:calc(var(--hero-x) * var(--s));
  right:calc(18 * var(--s));
  top:calc(var(--hero-y) * var(--s));
  bottom:0;
  border-radius:calc(16 * var(--s)) calc(16 * var(--s)) 0 0;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.hero-photo{                    /* 1060 x 707 over a 1020-wide box = 103.92% */
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:103.92%;height:auto;min-height:100%;
  object-fit:cover;object-position:center top;
  image-rendering:auto;
}

  display:block;flex:none;color:#fff;overflow:visible;

  left:calc(-2 * var(--s));
  top:calc(1 * var(--s));
}

  width:calc(79 * var(--s));height:calc(11.7 * var(--s));

  top:calc(2 * var(--s));

/* ----------------------------------------------------------------- title */
.title{
  position:absolute;
  left:calc(322 * var(--s));
  top:calc(25 * var(--s));
  width:calc(378 * var(--s));height:calc(101 * var(--s));
  display:block;image-rendering:auto;
  background-image:var(--title-src);background-size:100% 100%;background-repeat:no-repeat;
}
/* shine: a tilted cream band swept across the glyphs, masked by the title art.
   Measured from the reference clip: 0.47s sweep, 4.9s cycle, ~18 degrees of tilt. */
.title-shine{position:absolute;inset:0;overflow:hidden;pointer-events:none;
  -webkit-mask-image:var(--title-src);mask-image:var(--title-src);
  -webkit-mask-size:100% 100%;mask-size:100% 100%;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;}
.title-shine::before{content:'';position:absolute;top:-25%;height:150%;left:-40%;width:20%;
  background:linear-gradient(90deg,rgba(255,246,214,0) 0%,rgba(255,246,214,.95) 50%,rgba(255,246,214,0) 100%);
  transform:skewX(-18deg) translateX(-100%);
  animation:title-shine var(--shine-cycle,2.2s) cubic-bezier(.45,.05,.35,1) 1.72s infinite;}
@keyframes title-shine{
  0%   {transform:skewX(-18deg) translateX(-100%)}
  21.4% {transform:skewX(-18deg) translateX(750%)}
  100% {transform:skewX(-18deg) translateX(750%)}
}

/* -------------------------------------------------------------- subtitle */
.sub{
  position:absolute;margin:0;
  left:calc(333 * var(--s));
  top:calc(125 * var(--s));
  font-family:'UI Light';font-weight:500;
  font-size:calc(15.4 * var(--s));
  letter-spacing:calc(0.659 * var(--s));
  line-height:1;white-space:nowrap;color:#fff;
}

/* ------------------------------------------------ tablet architecture ---
   Breakpoint taken from the design, not a device: the header never collides
   (everything scales together) so the real failure is legibility. Nav type
   reads 13.1px at 1024, 12.3px at 960 and 11.5px at 900 - that is the floor,
   so 900px is where the bar restructures. */
.burger{display:none}
.navwrap{display:contents}

@media (max-width:900px){
  .brand{left:calc(26 * var(--s))}
  .searchbtn{right:calc(66 * var(--s));top:calc(30 * var(--s))}
  .searchbtn::after,.burger::after{content:'';position:absolute;inset:-14px}

  .burger{
    display:block;position:absolute;
    right:calc(26 * var(--s));top:calc(29 * var(--s));
    width:calc(20 * var(--s));height:calc(20 * var(--s));
    padding:0;border:0;background:none;cursor:pointer;z-index:22;
  }
  .burger svg{width:100%;height:100%;display:block;fill:#98A3B5;
    shape-rendering:geometricPrecision}
  .burger .bar{transform-origin:50% 50%;
    transition:transform .16s cubic-bezier(.33,.9,.5,1),opacity .12s ease}
  .topbar.open .burger .bar.t{transform:translateY(4px) rotate(45deg)}
  .topbar.open .burger .bar.b{transform:translateY(-4px) rotate(-45deg)}
  .topbar.open .burger .bar.m{opacity:0}

  /* panel: same ink, same stepped corners and border-wrapping as the buttons */
  .navwrap{
    display:flex;flex-direction:column;align-items:stretch;
    position:absolute;z-index:20;
    top:calc(64 * var(--s));right:calc(26 * var(--s));
    width:min(calc(272 * var(--s)), calc(100vw - 52 * var(--s)));
    --u:calc(0.3694 * var(--s));
    padding:calc(9 * var(--s));background:#1C1A1F;
    clip-path:polygon(
      calc(12 * var(--u)) 0, calc(100% - 12 * var(--u)) 0,
      calc(100% - 12 * var(--u)) calc(4 * var(--u)), calc(100% - 7 * var(--u)) calc(4 * var(--u)),
      calc(100% - 7 * var(--u)) calc(7 * var(--u)), calc(100% - 4 * var(--u)) calc(7 * var(--u)),
      calc(100% - 4 * var(--u)) calc(11 * var(--u)), 100% calc(11 * var(--u)),
      100% calc(100% - 11 * var(--u)),
      calc(100% - 4 * var(--u)) calc(100% - 11 * var(--u)), calc(100% - 4 * var(--u)) calc(100% - 7 * var(--u)),
      calc(100% - 7 * var(--u)) calc(100% - 7 * var(--u)), calc(100% - 7 * var(--u)) calc(100% - 4 * var(--u)),
      calc(100% - 12 * var(--u)) calc(100% - 4 * var(--u)), calc(100% - 12 * var(--u)) 100%,
      calc(12 * var(--u)) 100%, calc(12 * var(--u)) calc(100% - 4 * var(--u)),
      calc(7 * var(--u)) calc(100% - 4 * var(--u)), calc(7 * var(--u)) calc(100% - 7 * var(--u)),
      calc(4 * var(--u)) calc(100% - 7 * var(--u)), calc(4 * var(--u)) calc(100% - 11 * var(--u)),
      0 calc(100% - 11 * var(--u)), 0 calc(11 * var(--u)),
      calc(4 * var(--u)) calc(11 * var(--u)), calc(4 * var(--u)) calc(7 * var(--u)),
      calc(7 * var(--u)) calc(7 * var(--u)), calc(7 * var(--u)) calc(4 * var(--u)),
      calc(12 * var(--u)) calc(4 * var(--u)));
    opacity:0;transform:translateY(calc(-6 * var(--s)));pointer-events:none;
    transition:opacity .14s ease,transform .14s cubic-bezier(.33,.9,.5,1);
  }
  .navwrap::before{content:'';position:absolute;inset:calc(1.6 * var(--s));
    background:#080B14;clip-path:inherit;z-index:0}
  .topbar.open .navwrap{opacity:1;transform:none;pointer-events:auto}

  .navlink{
    position:static!important;left:auto!important;top:auto!important;
    z-index:1;width:100%;justify-content:space-between;
    padding:calc(9 * var(--s)) calc(10 * var(--s));
    font-size:max(13.5px, calc(15 * var(--s)));
  }
  .navlink+.navlink{border-top:1px solid rgba(255,255,255,.07)}
  .navlink:hover{background:rgba(255,255,255,.05)}

  .btn-sm{position:relative;right:auto;top:auto;z-index:1;
    align-self:center;margin:calc(13 * var(--s)) 0 calc(5 * var(--s))}

  /* hero keeps its composition, re-centred for the narrower canvas */
  .stage{width:100%}
  .eyebrow{left:50%;transform:translateX(-50%)}
  .title{left:50%;margin-left:calc(-189 * var(--s))}
  .sub{left:50%;transform:translateX(-50%)}
  .btn-lg{left:50%;margin-left:calc(-87 * var(--s))}

/* ================================================================ ENTRANCE
   One master sequence, ~1.8s, runs once on load then removes itself.
   The hero photograph is the stage and never moves; the forest frame
   composes around it, then the content performs inside it.
   All motion uses the individual `translate`/`scale` properties so it
   composes with, and never clobbers, existing transforms.            */
@media (prefers-reduced-motion:no-preference){
  @keyframes e-frame-top{from{opacity:0;translate:0 calc(-13 * var(--s))}to{opacity:1;translate:0 0}}
  @keyframes e-frame-bot{from{opacity:0;translate:0 calc(13 * var(--s))}to{opacity:1;translate:0 0}}
  @keyframes e-fade    {from{opacity:0}to{opacity:1}}
  @keyframes e-rise    {from{opacity:0;translate:0 calc(9 * var(--s))}to{opacity:1;translate:0 0}}
  @keyframes e-rise-sm {from{opacity:0;translate:0 calc(6 * var(--s))}to{opacity:1;translate:0 0}}
  @keyframes e-title{
    from{opacity:0;translate:0 calc(13 * var(--s));clip-path:inset(0 0 100% 0)}
    to  {opacity:1;translate:0 0;             clip-path:inset(0 0 0 0)}
  }
  @keyframes e-cta{from{opacity:0;translate:0 calc(8 * var(--s));scale:.975}
                   to  {opacity:1;translate:0 0;scale:1}}

  /* 01 - the frame composes the shot */
  html.entering .canopy-top   {animation:e-frame-top .85s cubic-bezier(.16,1,.3,1) .05s both}
  html.entering .canopy-bottom{animation:e-frame-bot .85s cubic-bezier(.16,1,.3,1) .05s both}
  html.entering .footer-fill  {animation:e-fade      .70s ease .05s both}

  /* 02 - navigation, understated: brand as one unit, then links */
  html.entering .brand    {animation:e-rise-sm .55s cubic-bezier(.22,.9,.3,1) .20s both}
  html.entering .navlink  {animation:e-rise-sm .50s cubic-bezier(.22,.9,.3,1) both}
  html.entering .navlink:nth-of-type(1){animation-delay:.30s}
  html.entering .navlink:nth-of-type(2){animation-delay:.345s}
  html.entering .navlink:nth-of-type(3){animation-delay:.39s}
  html.entering .navlink:nth-of-type(4){animation-delay:.435s}
  html.entering .navlink:nth-of-type(5){animation-delay:.48s}
  html.entering .searchbtn{animation:e-rise-sm .50s cubic-bezier(.22,.9,.3,1) .50s both}
  html.entering .btn-sm   {animation:e-rise-sm .50s cubic-bezier(.22,.9,.3,1) .54s both}
  html.entering .burger   {animation:e-rise-sm .50s cubic-bezier(.22,.9,.3,1) .50s both}

  /* 03 - eyebrow sets context just before the headline */
  html.entering .eyebrow{animation:e-rise .50s cubic-bezier(.22,.9,.3,1) .58s both}

  /* 04 - the headline: wipes in reading order while rising into place */
  html.entering .title{animation:e-title .85s cubic-bezier(.16,1,.3,1) .72s both}

  /* 05 / 06 - supporting copy, then the action */
  html.entering .sub   {animation:e-rise .55s cubic-bezier(.22,.9,.3,1) 1.12s both}
  html.entering .btn-lg{animation:e-cta  .50s cubic-bezier(.33,.9,.5,1) 1.30s both}
}

/* ------------------------------------------------ mobile architecture ---
   The hero stops being an absolutely-positioned composition and becomes a
   flow-stacked column, so the subtitle is free to wrap and set its own
   readable size without colliding with the CTA below it. Same elements,
   same order, same components - different placement system. */
@media (max-width:420px){
  .stage{
    position:relative;display:flex;flex-direction:column;align-items:center;
    width:100%;height:auto;transform:translateY(calc(-30 * var(--s)));
  }
  .eyebrow,.title,.sub,.btn-lg{
    position:relative;left:auto;right:auto;top:auto;transform:none;margin-left:0;
  }
  /* rhythm carried over from the desktop composition (12 / 15 / 28) */
  .title{
    margin-top:calc(12 * var(--s));
    width:min(86vw, calc(378 * var(--s)));height:auto;aspect-ratio:378 / 101;
  }
  .sub{
    margin-top:calc(16 * var(--s));
    width:min(86vw, calc(352 * var(--s)));
    white-space:normal;text-align:center;
    text-wrap:balance;              /* avoids the orphaned last word */
    font-size:max(13.5px, calc(15.4 * var(--s)));
    line-height:1.36;
  }
  .btn-lg{margin-top:calc(26 * var(--s))}

  /* menu spans the width on a phone, same panel treatment */
  .navwrap{left:calc(26 * var(--s));width:auto}
  .navlink{padding:calc(11 * var(--s)) calc(10 * var(--s))}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:calc(2 * var(--s)) solid #FBB916;outline-offset:calc(2 * var(--s))}

<script>
(function(){
  var bar=document.querySelector('.topbar'),btn=document.querySelector('.burger');
  if(!bar||!btn)return;
  function set(o){bar.classList.toggle('open',o);
    btn.setAttribute('aria-expanded',o?'true':'false');
    btn.setAttribute('aria-label',o?'Close menu':'Open menu');}
  btn.addEventListener('click',function(e){e.stopPropagation();set(!bar.classList.contains('open'));});
  document.addEventListener('click',function(e){
    if(bar.classList.contains('open')&&!bar.contains(e.target))set(false);});
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&bar.classList.contains('open')){set(false);btn.focus();}});
  addEventListener('resize',function(){if(innerWidth>900)set(false);});
  // entrance ends here: drop the class so no animation state survives it
  var root=document.documentElement;
  if(root.classList.contains('entering')){
    var done=function(){root.classList.remove('entering');};
    if(matchMedia('(prefers-reduced-motion:reduce)').matches) done();
    else setTimeout(done,2100);
  }
})();
</script>
