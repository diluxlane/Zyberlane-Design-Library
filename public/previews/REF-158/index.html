<script>
(function () {
  /* Design frame: 1584 x 993 (the reference). Every layer is authored in design px and
     scaled uniformly, so all measured geometry/spacing is preserved at any size.
       A) aspect >= 1.3 : composition locked to the viewport height (zero top/bottom gap),
                          centred horizontally; nav pinned to the viewport edges.
       B) aspect <  1.3 : stacked column - nav / headline (3 lines) / scene anchored to the
                          bottom edge. Headline size and scene scale are solved together so
                          the column is filled exactly: no empty band at top or bottom.     */
  var DW = 1584, DH = 993, PHONE_TOP = 366, FOCUS_X = 800, F1 = 154.8;
  var root = document.documentElement;
  var stage = document.getElementById('stage');
  var ring = document.getElementById('ringLayer');
  var hl = document.getElementById('hl');
  var L1 = document.getElementById('L1'), L2a = document.getElementById('L2a'), L2b = document.getElementById('L2b');
  var lines = [L1, L2a, L2b];
  function T(el, tx, ty, s) { el.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')'; }
  function num(el, k) { return parseFloat(el.dataset[k]); }

  function layout() {
    var vw = root.clientWidth || window.innerWidth, vh = window.innerHeight, a = vw / vh;

    if (a >= 1.3) {                                   /* ---------- A ---------- */
      var s = vh / DH, tx = (vw - DW * s) / 2;
      root.style.setProperty('--sn', s);
      root.style.setProperty('--nx', '0px');
      T(stage, tx, 0, s); T(ring, tx, 0, s); T(hl, tx, 0, s);
      hl.classList.remove('m');
      lines.forEach(function (l) { l.style.left = l.dataset.x + 'px'; l.style.top = l.dataset.y + 'px'; l.style.transform = ''; });
      return;
    }

    /* ---------- B: stacked ---------- */
    var sn = Math.min(0.95, Math.max(0.66, vw / 1000));
    var margin = Math.max(16, Math.round(vw * 0.05));
    root.style.setProperty('--sn', sn);
    root.style.setProperty('--nx', (margin - 103 * sn) + 'px');
    var navH = 92 * sn, AIR = 30, CAP = 133, PITCH = 160.7, OVER = 27, SCENE = DH - PHONE_TOP;
    var sMin = vw / 1400, sMax = vw / 520;
    function plan(nLines, rowW) {
      var kw = (vw - 2 * margin) / rowW;
      var over = nLines === 2 ? OVER : -14, pitch = nLines === 2 ? PITCH : 172;
      var K = AIR + CAP + (nLines - 1) * pitch - over;          // nav-bottom .. phone-top, in design px
      var s2 = Math.min(sMax, Math.max(sMin, (vh - navH - K * kw) / SCENE));
      var phoneTop = vh - SCENE * s2;
      var k = Math.min(kw, (phoneTop - navH) / K);
      return { n: nLines, k: k, K: K, s2: s2, phoneTop: phoneTop, over: over, pitch: pitch };
    }
    var w2 = 1383 - 164, w3 = Math.max(num(L1, 'w'), num(L2a, 'w'), num(L2b, 'w'));
    var a2 = plan(2, w2), a3 = plan(3, w3);
    var pl = a2.k >= a3.k * 0.92 ? a2 : a3;                    // prefer the reference 2-line set when close
    var k = pl.k, s2 = pl.s2;
    var tx2 = vw / 2 - FOCUS_X * s2, ty2 = vh - DH * s2;
    T(stage, tx2, ty2, s2); T(ring, tx2, ty2, s2);
    hl.classList.add('m');
    hl.style.transform = 'none';
    // spare height (only when width-limited) is split evenly above/below the headline
    var spare = Math.max(0, pl.phoneTop - navH - pl.K * k);
    var lastBase = pl.phoneTop - spare / 2 + pl.over * k;
    lines.forEach(function (l) { l.style.left = '0px'; l.style.top = '0px'; });
    if (pl.n === 2) {
      var x0 = (vw - w2 * k) / 2, b2 = lastBase, b1 = b2 - PITCH * k;
      T(L1, x0 + (num(L1, 'x') - 164) * k, b1 - num(L1, 'base') * k, k);
      T(L2a, x0 + (num(L2a, 'x') - 164) * k, b2 - num(L2a, 'base') * k, k);
      T(L2b, x0 + (num(L2b, 'x') - 164) * k, b2 - num(L2b, 'base') * k, k);
    } else {
      [L1, L2a, L2b].forEach(function (l, i) {
        var w = num(l, 'w') * k, base = lastBase - (2 - i) * pl.pitch * k;
        T(l, (vw - w) / 2, base - num(l, 'base') * k, k);
      });
    }
  }

  var raf = 0;
  function schedule() { cancelAnimationFrame(raf); raf = requestAnimationFrame(layout); }
  window.addEventListener('resize', schedule);
  window.addEventListener('orientationchange', schedule);
  if (window.visualViewport) visualViewport.addEventListener('resize', schedule);
  layout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
})();

</script>
<script>
/* ============================================================================
   ORBIT CAROUSEL: nine cards ride the measured track around the phone in true
   perspective (shared vanishing point at the track centre). Cards face outward,
   so they turn edge-on at the limbs and pass behind the phone at the back.
   One requestAnimationFrame loop; compositor-only properties (transform, opacity).
   Entrance: a spin that decays (easeOutCubic) into the steady rotation, so the
   velocity curve is continuous - no hand-off jolt. Reduced motion: static.
   ========================================================================== */
(function () {
  var C = {"cx": 814.8, "cy": 689.0, "a": 645.5, "b": 103.3, "rot": -8.224, "P": 1600.0, "ZR": 512.0, "W": 313.0, "H": 182.0, "phase": 95.0, "step": 45.0, "yaw": 60.0, "period": 56.0, "lean": -7.0, "lean_k": 6.0, "shade": 0.34};
  var root = document.documentElement;
  var cards = [].slice.call(document.querySelectorAll('.oc'));
  if (!cards.length) return;
  var shades = cards.map(function (el) { return el.querySelector('.sh'); });
  var slot = cards.map(function (el) { return parseFloat(el.dataset.slot); });
  var lastZ = cards.map(function () { return -1; });
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var D2R = Math.PI / 180, ph = C.rot * D2R, cph = Math.cos(ph), sph = Math.sin(ph);

  function place(i, thetaDeg) {
    var th = thetaDeg * D2R, s = Math.sin(th), co = Math.cos(th);
    var xr = C.a * co, yr = C.b * s;
    var X = xr * cph - yr * sph, Y = xr * sph + yr * cph;
    var z = C.ZR * s, k = (C.P - z) / C.P;
    // apparent yaw = designed curve; subtract the off-axis viewing angle so the card never reads edge-on
    var ry = C.yaw * co - Math.atan2(X * k, C.P - z) / D2R;
    var rz = C.lean - C.lean_k * co * Math.tanh(6 * s);
    var el = cards[i];
    el.style.transform = 'translate(' + C.cx + 'px,' + C.cy + 'px) perspective(' + C.P + 'px) translate3d(' +
      (X * k).toFixed(2) + 'px,' + (Y * k).toFixed(2) + 'px,' + z.toFixed(2) + 'px) rotateY(' + ry.toFixed(3) +
      'deg) rotateZ(' + rz.toFixed(3) + 'deg) translate(' + (-C.W / 2) + 'px,' + (-C.H / 2) + 'px)';
    var zi = s > 0 ? 10 + Math.round(5 * s) : 1 + Math.round(4 * (1 + s));
    if (zi !== lastZ[i]) { el.style.zIndex = zi; lastZ[i] = zi; }   // phone sits at 6
    shades[i].style.opacity = (C.shade * (1 - (s + 1) / 2)).toFixed(3);
  }

  if (reduce) { cards.forEach(function (_, i) { place(i, C.phase + slot[i] * C.step); }); return; }

  var SPIN = 64, SPIN_MS = 2300, DELAY = 520, FADE = 600, STAGGER = 55;
  var intro = root.classList.contains('intro'), t0 = null, introDone = !intro;
  var easeOut = function (x) { x = Math.min(Math.max(x, 0), 1); return 1 - Math.pow(1 - x, 3); };
  // draw opening pose immediately (entrance pre-state keeps cards hidden until the timeline starts)
  cards.forEach(function (_, i) { place(i, C.phase + slot[i] * C.step - (intro ? SPIN : 0)); });

  var last = null, t = 0;
  function frame(now) {
    if (last === null) last = now;
    t += Math.min(now - last, 50); last = now;      // capped delta: no jump after a hidden tab
    var spin = intro ? -SPIN * (1 - easeOut((t - DELAY) / SPIN_MS)) : 0;
    var base = C.phase + (t / (C.period * 1000)) * 360 + spin;
    for (var i = 0; i < cards.length; i++) {
      place(i, base + slot[i] * C.step);
      if (!introDone) {
        // entrance fade, ordered round the orbit from the front card
        var o = easeOut((t - DELAY - i * STAGGER) / FADE);
        cards[i].style.opacity = o.toFixed(3);
      }
    }
    if (!introDone && t > DELAY + SPIN_MS) {
      introDone = true; cards.forEach(function (el) { el.style.opacity = ''; });
    }
    requestAnimationFrame(frame);
  }
  var started = false;
  function go() {
    if (started) return; started = true;
    if (intro) cards.forEach(function (el) { el.style.opacity = '0'; });
    requestAnimationFrame(frame);
  }
  if (intro) {
    document.addEventListener('sphere:intro', go, { once: true });
    setTimeout(function () { if (!started) { intro = false; introDone = true; go(); } }, 3000);   // failsafe: never strand the cards
  } else go();
})();

</script>
<script>
/* ============================================================================
   ENTRANCE — one master timeline, runs once on first load, then the page is static.
   Web Animations API (no dependency). Only transform / translate / scale / opacity
   are animated; clip-path is a static mask applied only while the entrance runs.
   Background (#000) and the light ring are the stage: never animated.

   0.00  stage already lit (static ring)
   0.10  logo                       nav settle   (opacity, 10px drop)
   0.18  "Your Music."              type mask    (rise from its own baseline)
   0.32  "Your People."             type mask
   0.40  "One App"                  type mask    (word group +80ms; own line +140ms when stacked)
   0.62  phone                      device rise  (lift + 0.965 -> 1)
   0.92  phone screen               lights up    (opacity)
   0.52  carousel: spins in (easeOutCubic) and settles into its continuous rotation
   1.45  Join waitlist              nav settle   (after the message has landed)
   ~2.3  entrance complete -> its animations cancelled, masks removed; only the carousel keeps turning
   ========================================================================== */
(function () {
  var root = document.documentElement;
  if (!root.classList.contains('intro') || window.__sphereIntro) return;
  window.__sphereIntro = true;

  var QUINT = 'cubic-bezier(0.22, 1, 0.36, 1)';   // easeOutQuint - settles, never overshoots
  var EXPO = 'cubic-bezier(0.16, 1, 0.3, 1)';     // easeOutExpo  - typographic snap
  var SOFT = 'cubic-bezier(0.33, 0, 0.2, 1)';     // opacity ramps
  var anims = [], masked = [];

  function at(el, frames, t, dur, ease) {
    if (!el) return;
    anims.push(el.animate(frames, { delay: t * 1000, duration: dur * 1000, easing: ease || QUINT, fill: 'backwards' }));
  }
  function fade(el, t, dur) { at(el, [{ opacity: 0 }, { opacity: 1 }], t, dur, SOFT); }

  function start() {
    var sn = parseFloat(getComputedStyle(root).getPropertyValue('--sn')) || 1;

    /* --- B. nav settle: logo first ---------------------------------------- */
    var logo = document.querySelector('.logo');
    at(logo, [{ translate: '0 ' + (-10 * sn) + 'px' }, { translate: '0 0' }], 0.10, 0.9);
    fade(logo, 0.10, 0.6);

    /* --- A. typographic mask: each line rises out of its own baseline ------ */
    // "One App" is a word group when it shares the line (desktop), its own line when stacked
    var a2 = document.getElementById('L2a'), b2 = document.getElementById('L2b');
    var ownLine = a2 && b2 && b2.getBoundingClientRect().top > a2.getBoundingClientRect().top + 4;
    [['L1', 0.18, 1.0], ['L2a', 0.32, 1.05], ['L2b', ownLine ? 0.46 : 0.40, 1.05]].forEach(function (d) {
      var line = document.getElementById(d[0]); if (!line) return;
      var gi = line.querySelector('.gi');
      var w = parseFloat(line.dataset.w), base = parseFloat(line.dataset.base), desc = parseFloat(line.dataset.desc);
      line.style.clipPath = 'polygon(-40px -40px,' + (w + 40) + 'px -40px,' + (w + 40) + 'px ' + (base + desc) + 'px,-40px ' + (base + desc) + 'px)';
      masked.push(line);
      at(gi, [{ transform: 'translateY(' + (base + desc + 6) + 'px)' }, { transform: 'none' }], d[1], d[2], EXPO);
    });

    /* --- C. device rise ---------------------------------------------------- */
    var phone = document.getElementById('phone');
    at(phone, [{ transform: 'translateY(48px) scale(0.965)' }, { transform: 'none' }], 0.62, 1.2);
    fade(phone, 0.62, 0.4);
    fade(phone && phone.querySelector('.ui'), 0.92, 0.55);

    /* --- D. orbit: the carousel runs its own spin-in, started on this same frame ------- */
    document.dispatchEvent(new CustomEvent('sphere:intro'));

    /* --- B. nav settle: the call to action closes the sequence ------------- */
    var cta = document.querySelector('.cta');
    at(cta, [{ translate: '0 ' + (-8 * sn) + 'px', scale: '0.97' }, { translate: '0 0', scale: '1' }], 1.45, 0.85);
    fade(cta, 1.45, 0.5);

    // first keyframes are now held by fill:backwards -> drop the CSS pre-state in the same frame
    root.classList.remove('intro');

    Promise.all(anims.map(function (a) { return a.finished; })).then(finish, finish);
  }

  function finish() {
    anims.forEach(function (a) { a.cancel(); });          // nothing left on the animation timeline
    masked.forEach(function (l) { l.style.clipPath = ''; });
    anims = []; masked = [];
    root.classList.add('intro-done');
  }

  // Wait (briefly) for embedded fonts + images so the sequence never plays over a swap.
  var ready = [document.fonts ? document.fonts.ready : null];
  [].forEach.call(document.images, function (img) { if (img.decode) ready.push(img.decode().catch(function () {})); });
  Promise.race([Promise.all(ready), new Promise(function (r) { setTimeout(r, 700); })])
    .then(function () { requestAnimationFrame(start); });
})();

</script>
