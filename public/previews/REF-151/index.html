<script>
(() => {
  const entrance = window.__veloraEntrance;
  if (!entrance) return;

  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    clearTimeout(entrance.guard);
    document.documentElement.classList.remove('entrance-pending');
    entrance.animations.forEach(animation => animation.cancel());
    delete window.__veloraEntrance;
  };

  const ease = 'cubic-bezier(.22,.76,.25,1)';
  const quietEase = 'cubic-bezier(.25,.72,.32,1)';
  const stages = [
    { selector: '.logo', at: 80, duration: 700, easing: ease,
      frames: [{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }] },
    { selector: '[data-k="signup"]', at: 370, duration: 500, easing: ease,
      frames: [{ opacity: 0, transform: 'translate3d(0,calc(var(--u) * 8),0)' },
               { opacity: 1, transform: 'none' }] },
    ...Array.from(document.querySelectorAll('.btn'), (target, index) => ({
      target, at: 610 + index * 95,
      duration: 540, easing: ease,
      frames: [{ opacity: 0, transform: 'translate3d(calc(var(--u) * -12),0,0)' },
               { opacity: 1, transform: 'none' }]
    })),
    { selector: '[data-k="help"]', at: 1130, duration: 360, easing: quietEase,
      frames: [{ opacity: 0 }, { opacity: 1 }] },
    { selector: '[data-k="now"]', at: 1240, duration: 430, easing: ease,
      frames: [{ opacity: 0, transform: 'translate3d(0,calc(var(--u) * 6),0)' },
               { opacity: 1, transform: 'none' }] },
    ...Array.from(document.querySelectorAll('.badge'), (target, index) => ({
      target, at: 1370 + index * 85, duration: 430, easing: ease,
      frames: [{ opacity: 0, transform: 'translate3d(0,calc(var(--u) * 8),0)' },
               { opacity: 1, transform: 'none' }]
    })),
    ...['privacy', 'terms'].map((key, index) => ({
      selector: `[data-k="${key}"]`, at: 1580 + index * 65,
      duration: 300, easing: quietEase,
      frames: [{ opacity: 0 }, { opacity: 1 }]
    }))
  ];

  try {
    for (const stage of stages) {
      const target = stage.target || document.querySelector(stage.selector);
      if (!target) throw new Error('Entrance target missing');
      entrance.animations.push(target.animate(stage.frames, {
        delay: stage.at, duration: stage.duration, easing: stage.easing, fill: 'both'
      }));
    }
    Promise.all(entrance.animations.map(animation => animation.finished)).then(finish, finish);
  } catch (_) {
    finish();
  }
})();
</script>
