<!doctype html>
<html lang="en">

<title>Loomix Footer</title>
<style>
/* ---------- Fonts: Inter Display subsets, locally hosted ---------- */
@font-face{font-family:"LX Display";font-weight:300;font-style:normal;font-display:block;src:url(assets/display-300.woff2) format("woff2")}
@font-face{font-family:"LX Display";font-weight:400;font-style:normal;font-display:block;src:url(assets/display-400.woff2) format("woff2")}
@font-face{font-family:"LX Display";font-weight:500;font-style:normal;font-display:block;src:url(assets/display-500.woff2) format("woff2")}

/* ---------- Tokens (sampled from the reference) ---------- */
:root{
  --bg:#0a0c0e;            /* page base            rgb(10,12,14)  */
  --glow-top:#fefefe;      /* top of the glow field                */
  --ink:#ffffff;           /* headings                             */
  --ink-2:rgba(255,255,255,.92); /* link text                      */
  --ink-3:rgba(255,255,255,.86); /* copyright                      */
  --accent:#ff4508;        /* "Book a call"                        */
  --font:"LX Display","Inter Display","Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);font-family:var(--font);color:var(--ink);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:geometricPrecision;
  font-feature-settings:"kern" 1;font-kerning:normal}
a{color:inherit;text-decoration:none}
ul{list-style:none;margin:0;padding:0}
h2,h3,p{margin:0;font-weight:inherit}
.sr{position:absolute;top:0;left:0;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Shell: always fills the viewport, no blank bands ---------- */
.ft{
  container:ft / inline-size;
  position:relative;min-height:100vh;min-height:100svh;
  display:flex;flex-direction:column;justify-content:flex-end;
  background:var(--bg);overflow:hidden;
}
.defs{position:absolute;width:0;height:0;overflow:hidden}

/* =====================================================================
   DESKTOP / LAPTOP / WIDE  (≥ 960px and landscape-ish — measured limit)
   The reference is 1326 × 1186; 1u = one reference pixel.
   • Below 1326px wide, u follows the width (layout keeps its proportions).
   • From 1326px up, u is capped at 1px (the design's true size) and only
     eases up to 1.16px on very large screens — content sits in a centred
     1326u frame while the glow, arc and dashed rule stay full-bleed.
   • Type has readable floors, so nothing drops below 13–16px on laptops.
   ===================================================================== */
.ft{background:var(--glow-top)}
.stage{--u:min(calc(100cqw / 1326), clamp(1px, calc(100cqw / 2200), 1.16px));
  --x0:calc((100cqw - 1326 * var(--u)) / 2);
  position:relative;width:100%;height:calc(1186 * var(--u));flex:none;background:var(--bg)}
.stage > *{position:absolute}

/* glow field: anchored at its bottom edge (y = 558u); if the viewport is
   taller than the composition it grows upward (white sky + fan lines). */
.glow-img,.glow-lines{left:0;top:0;width:100%;height:calc(558 * var(--u));overflow:visible;pointer-events:none}
.dash{left:0;top:calc(964 * var(--u));width:100%;height:calc(2 * var(--u));overflow:visible;pointer-events:none}
.dash line{stroke:#fff;stroke-opacity:0.115;stroke-width:calc(1 * var(--u));
  stroke-dasharray:calc(7.5 * var(--u)) calc(6.47 * var(--u));
  stroke-dashoffset:calc(1.2 * var(--u) - var(--x0))}
.glow-m{display:none}
.rules{left:var(--x0);top:0;width:calc(1326 * var(--u));height:100%;overflow:visible;pointer-events:none}

.logo-d{left:calc(var(--x0) + 570 * var(--u));top:calc(500 * var(--u));width:calc(102 * var(--u));height:calc(405 * var(--u))}
.logo-h{display:none}

.headline{left:calc(var(--x0) + 71.8 * var(--u));top:calc(589.2 * var(--u));
  font-size:max(22px, calc(29 * var(--u)));font-weight:500;line-height:max(27px, calc(35.5 * var(--u)));letter-spacing:0em;white-space:nowrap}

.cta{left:calc(var(--x0) + 73.3 * var(--u));top:calc(741.3 * var(--u));display:block}
.cta-ring{position:absolute;left:0;top:0;width:calc(76 * var(--u));height:calc(76 * var(--u));border-radius:50%;
  border:calc(1 * var(--u)) solid rgba(255,255,255,0.82);display:grid;place-items:center;
  transition:background-color .35s ease,border-color .35s ease,transform .35s cubic-bezier(.2,.7,.2,1)}
.cta-ring svg{width:calc(17 * var(--u));height:calc(17 * var(--u));transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.cta-label{position:absolute;left:calc(89.5 * var(--u));top:calc(23.1 * var(--u));white-space:nowrap;
  font-size:max(22px, calc(30 * var(--u)));font-weight:400;line-height:max(22px, calc(30 * var(--u)));color:var(--accent);letter-spacing:0em}
.cta-label::after{content:"";position:absolute;left:calc(2.6 * var(--u));right:calc(1.0 * var(--u));top:calc(32.2 * var(--u));
  height:calc(1.6 * var(--u));background:currentColor;transform-origin:left;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
@media (hover:hover){
.cta:hover .cta-ring{background:rgba(255,69,8,.12);border-color:var(--accent)}
.cta:hover .cta-ring svg{transform:rotate(45deg)}
.cta:hover .cta-label::after{transform:scaleX(.0001);transform-origin:right}
}

.headline,.cta,.col,.social,.copy{position:absolute}
.col{top:0;left:var(--x0)}
.col h3{position:absolute;top:calc(593.8 * var(--u));white-space:nowrap;font-size:max(20px, calc(28 * var(--u)));font-weight:500;line-height:max(20px, calc(28 * var(--u)));letter-spacing:0.004em}
.col ul{position:absolute;top:calc(631.8 * var(--u));white-space:nowrap}
.col li{font-size:max(16px, calc(21.6 * var(--u)));font-weight:300;line-height:calc(58.75 * var(--u));color:var(--ink-2);letter-spacing:0.012em}
.col a{transition:color .25s ease}
@media (hover:hover){
.col a:hover{color:var(--accent)}
}
.col-imp h3,.col-imp ul{left:calc(858.6 * var(--u))}
.col-legal h3,.col-legal ul{left:calc(1077.6 * var(--u))}
.col-legal li{letter-spacing:0.016em}
.amp{margin:0 calc(-1.6 * var(--u))}

.social{left:var(--x0);top:0}
.social h3{position:absolute;left:calc(72 * var(--u));top:calc(1024.8 * var(--u));white-space:nowrap;
  font-size:max(20px, calc(28 * var(--u)));font-weight:500;line-height:max(20px, calc(28 * var(--u)));letter-spacing:0.004em}
.icons{position:absolute;left:calc(72.95 * var(--u));top:calc(1074 * var(--u));display:flex;gap:calc(20.21 * var(--u))}
.icons a{position:relative;display:grid;place-items:center;width:max(38px, calc(45.3 * var(--u)));height:max(38px, calc(45.3 * var(--u)));border-radius:50%;
  /* glass: measured radial luminance ramp, rim → centre */
  background:radial-gradient(closest-side,rgba(255,255,255,0.040) 0%, rgba(255,255,255,0.048) 42%, rgba(255,255,255,0.057) 56%, rgba(255,255,255,0.071) 65%, rgba(255,255,255,0.082) 69%, rgba(255,255,255,0.093) 73.5%, rgba(255,255,255,0.104) 78%, rgba(255,255,255,0.116) 82%, rgba(255,255,255,0.131) 87%, rgba(255,255,255,0.148) 91%, rgba(255,255,255,0.180) 95.5%, rgba(255,255,255,0.200) 100%);
  -webkit-backdrop-filter:blur(12px) saturate(140%);backdrop-filter:blur(12px) saturate(140%);
  transition:transform .3s cubic-bezier(.2,.7,.2,1),background-color .3s ease}
@media (hover:hover){
.icons a:hover{transform:translateY(calc(-3 * var(--u)));background-color:rgba(255,255,255,.06)}
}
.icons svg{width:max(15px, calc(16 * var(--u)));height:max(15px, calc(16 * var(--u)));display:block}

.copy{right:calc(var(--x0) + 73.5 * var(--u));top:calc(1099.04 * var(--u));white-space:nowrap;
  font-size:max(13px, calc(15.1 * var(--u)));font-weight:300;line-height:max(13px, calc(15 * var(--u)));color:var(--ink-3);letter-spacing:0em}

/* focus states (keyboard) */
.ft a:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.icons a:focus-visible{border-radius:50%}

/* =====================================================================
   REFLOW LAYER — tablet + mobile (one DOM, one grid, named areas).
   Runs below the measured desktop limit (960px), on portrait screens,
   and on every touch-primary device.
   ONE-SCREEN RULE: on these devices the footer always fits 100svh — no
   vertical scroll. Every size token is   max(floor, min(width-fluid, height-fluid))
   so tall screens keep the full-size design and short screens compress
   the rhythm (never below readable floors). The glow band takes whatever
   height is left over.
   ===================================================================== */
@media (max-width: 959.98px), (max-aspect-ratio: 899/1000), ((hover: none) and (pointer: coarse)){
  .ft{background:var(--bg);overflow:visible;height:100svh;min-height:0}
  .stage{
    --pad:max(clamp(32px,5.6cqw,56px), calc((100cqw - 1120px) / 2),
              env(safe-area-inset-left), env(safe-area-inset-right));
    --rule:rgba(255,255,255,.1);
    /* ---- tablet tokens ---- */
    --glow-min: min(clamp(240px,34cqw,440px), max(48px, calc(34svh - 90px)));
    --logo-w:   min(calc(100cqw - 2 * var(--pad)), 560px, 70svh);
    --sp-1:     max(10px, min(clamp(28px,4.4cqw,44px), 3.2svh));   /* logo → rule      */
    --sp-2:     max(12px, min(clamp(36px,5.2cqw,52px), 3.6svh));   /* band padding     */
    --sp-3:     max(10px, min(clamp(28px,4cqw,40px), 3.2svh));     /* headline → CTA   */
    --t-head:   max(16px, min(clamp(23px,2.6cqw,28px), 3.3svh));
    --t-cta:    max(16px, min(clamp(22px,2.6cqw,28px), 3.2svh));
    --ring:     max(40px, min(clamp(60px,7cqw,72px), 8.6svh));
    --t-title:  max(15px, min(clamp(20px,2.2cqw,24px), 2.9svh));
    --t-link:   max(13px, min(clamp(16px,1.9cqw,19px), 2.2svh));
    --row:      max(24px, min(2.72em, 5.6svh));                    /* link row height  */
    --icon:     max(34px, min(46px, 7.4svh));
    --t-copy:   max(11.5px, min(13.5px, 2svh));
    --sp-soc:   max(10px, min(clamp(32px,4.6cqw,44px), 3.4svh));
    position:relative;height:auto;flex:1 1 auto;min-height:0;
    display:grid;grid-template-columns:minmax(0,1fr) auto;
    grid-template-rows:minmax(var(--glow-min),1fr) auto auto auto;
    grid-template-areas:"glow glow" "logo logo" "main main" "social copy";
  }
  .stage > *,.headline,.cta,.col,.social,.copy{position:relative;left:auto;top:auto;right:auto;bottom:auto}
  .glow-img,.glow-lines,.dash,.rules,.logo-d{display:none}

  /* glow band: absorbs spare height; never zoomed past 0.75 × width —
     beyond that the extra becomes open sky (as on desktop) */
  .stage::before{content:"";grid-area:glow;background:var(--glow-top)}
  .glow-m{display:block;grid-area:glow;align-self:end;width:100%;height:100%;max-height:75cqw;contain:size}

  /* wordmark rises out of the glow, as on desktop */
  .logo-h{display:block;grid-area:logo;justify-self:center;width:var(--logo-w);height:auto;aspect-ratio:398/96;
    margin-top:calc(-0.11 * var(--logo-w))}

  /* main band: divider #2 = rule under the wordmark; divider #1 stays
     vertical between CTA block and links; dashed rule closes the band */
  .main{grid-area:main;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;
    margin:var(--sp-1) var(--pad) 0;padding:var(--sp-2) 0;border-top:1px solid var(--rule)}
  .main::after{content:"";position:absolute;left:calc(-1 * var(--pad));right:calc(-1 * var(--pad));bottom:0;height:1px;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 7px,transparent 7px 14px)}
  .lead{padding-right:clamp(24px,4cqw,48px)}
  .headline{white-space:normal;text-wrap:balance;max-width:15.5em;font-size:var(--t-head);line-height:1.224;letter-spacing:0}
  .headline br{display:none}
  .cta{display:flex;align-items:center;gap:clamp(12px,1.8cqw,18px);margin-top:var(--sp-3);width:max-content}
  .cta-ring{position:relative;width:var(--ring);height:var(--ring);border-width:1px}
  .cta-ring svg{width:calc(var(--ring) * .24);height:calc(var(--ring) * .24)}
  .cta-label{position:relative;left:auto;top:auto;font-size:var(--t-cta);line-height:1.2;padding-bottom:.25em}
  .cta-label::after{left:0;right:0;top:auto;bottom:0;height:1.5px}

  .nav{display:grid;grid-template-columns:max-content max-content;column-gap:clamp(36px,5cqw,64px);
    border-left:1px solid var(--rule);padding-left:clamp(28px,4.4cqw,52px)}
  .col{position:static}
  .col h3,.col ul{position:static;left:auto;top:auto}
  .col h3{font-size:var(--t-title);line-height:1.2;margin-bottom:calc(var(--row) * .12)}
  .col li{font-size:var(--t-link);line-height:var(--row);white-space:nowrap}
  .col a{display:inline-block}
  .amp{margin:0}

  /* bottom band: socials left, copyright right on the icon line (as desktop) */
  .social{grid-area:social;padding:var(--sp-soc) 0 max(var(--sp-soc),env(safe-area-inset-bottom)) var(--pad);
    display:flex;flex-direction:column;gap:max(10px, min(20px, 2svh))}
  .social h3{position:static;font-size:var(--t-title);line-height:1.2}
  .icons{position:static;gap:max(10px, min(clamp(14px,2cqw,20px), 2svh))}
  .icons a{width:var(--icon);height:var(--icon)}
  .icons svg{width:16px;height:16px}
  .copy{grid-area:copy;align-self:end;justify-self:end;text-align:right;
    padding:0 var(--pad) calc(max(var(--sp-soc),env(safe-area-inset-bottom)) + var(--icon) / 2 - .7em) 16px;
    font-size:var(--t-copy);line-height:1.4;white-space:nowrap}
}

/* SHORT screens in the tablet layout (landscape phones / tablets):
   "Follow us" sits inline before the icons, like a desktop toolbar row. */
@media (max-height: 699.98px) and (min-aspect-ratio: 6/5){
  .social{flex-direction:row;align-items:center;gap:clamp(14px,2.4cqw,28px)}
  .social h3{white-space:nowrap}
}

/* MOBILE (portrait phones, measured: < 640px) — areas stack, link columns
   stay side by side, copyright drops under the icons. */
@media (max-width: 639.98px) and (max-aspect-ratio: 119/100){
  .stage{
    --pad:max(clamp(20px,6cqw,32px), env(safe-area-inset-left), env(safe-area-inset-right));
    --glow-min: min(clamp(200px,54cqw,320px), max(56px, calc(30svh - 104px)));
    --logo-w:   min(calc(100cqw - 2 * var(--pad)), 560px, 44svh);
    --sp-1:     max(10px, min(clamp(22px,6cqw,32px), 2.4svh));
    --sp-2:     max(14px, min(clamp(30px,8cqw,40px), 3.2svh));
    --sp-3:     max(12px, min(clamp(24px,7cqw,32px), 2.8svh));
    --t-head:   max(18px, min(clamp(21px,5.9cqw,23px), 2.9svh));
    --t-cta:    max(17px, min(clamp(20px,5.6cqw,22px), 2.7svh));
    --ring:     max(44px, min(clamp(54px,15cqw,60px), 6.8svh));
    --t-title:  max(16px, min(clamp(19px,5.2cqw,20px), 2.5svh));
    --t-link:   max(14px, min(16px, 2svh));
    --row:      max(27px, min(2.72em, 5svh));
    --icon:     max(36px, min(clamp(42px,11.6cqw,46px), 5.6svh));
    --t-copy:   max(11.5px, min(13px, 1.7svh));
    --sp-soc:   max(12px, min(clamp(28px,8cqw,36px), 3.2svh));
    grid-template-columns:minmax(0,1fr);
    grid-template-rows:minmax(var(--glow-min),1fr) auto auto auto auto;
    grid-template-areas:"glow" "logo" "main" "social" "copy";
  }
  .main{grid-template-columns:minmax(0,1fr)}
  .lead{padding-right:0}
  .headline{max-width:17em}
  .cta{gap:clamp(12px,3.6cqw,16px)}
  .nav{border-left:0;padding-left:0;border-top:1px solid var(--rule);
    margin-top:var(--sp-2);padding-top:var(--sp-3);
    grid-template-columns:minmax(0,1fr) minmax(max-content,1fr);column-gap:clamp(20px,6cqw,40px)}
  .social{padding:var(--sp-soc) var(--pad) 0}
  .icons{gap:clamp(10px,3.6cqw,16px)}
  .copy{justify-self:start;text-align:left;white-space:normal;
    padding:max(8px, min(clamp(18px,5cqw,24px), 2svh)) var(--pad) max(var(--sp-soc),env(safe-area-inset-bottom))}
}
/* shorter phones: "Follow us" moves inline with the icons to save a row */
@media (max-width: 639.98px) and (max-aspect-ratio: 119/100) and (max-height: 759.98px){
  .social{flex-direction:row;flex-wrap:wrap;align-items:center;column-gap:clamp(10px,3.4cqw,20px);row-gap:10px}
  .social h3{white-space:nowrap}
  .icons{gap:clamp(6px,2.4cqw,16px)}
}
/* desktop: the wrapper divs are layout-transparent */
@media (min-width: 960px) and (min-aspect-ratio: 9/10) and (not ((hover: none) and (pointer: coarse))){ .main,.nav{display:contents} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* One opening composition: the backdrop and structural rules stay still. */
@media (prefers-reduced-motion:no-preference){
  .ft.entry .logo-d,.ft.entry .logo-h{
    animation:loomix-mark .86s cubic-bezier(.22,1,.36,1) .06s backwards}
  .ft.entry .headline{
    animation:loomix-headline .78s cubic-bezier(.22,1,.36,1) .33s backwards}
  .ft.entry .col-imp{
    animation:loomix-group .58s cubic-bezier(.22,1,.36,1) .58s backwards}
  .ft.entry .col-legal{
    animation:loomix-group .58s cubic-bezier(.22,1,.36,1) .68s backwards}
  .ft.entry .cta{
    animation:loomix-group .62s cubic-bezier(.22,1,.36,1) .82s backwards}
  .ft.entry .social{
    animation:loomix-presence .48s cubic-bezier(.22,1,.36,1) 1.08s backwards}
  .ft.entry .copy{
    animation:loomix-presence .45s cubic-bezier(.22,1,.36,1) 1.19s backwards}
}
@keyframes loomix-mark{
  from{opacity:0;clip-path:inset(0 0 100% 0)}
  to{opacity:1;clip-path:inset(0)}
}
@keyframes loomix-headline{
  from{opacity:0;clip-path:inset(0 0 100% 0);transform:translateY(10px)}
  to{opacity:1;clip-path:inset(0);transform:none}
}
@keyframes loomix-group{
  from{opacity:0;transform:translateY(9px)}
  to{opacity:1;transform:none}
}
@keyframes loomix-presence{
  from{opacity:0}
  to{opacity:1}
}
</style>
</head>
<body>
<footer class="ft entry" aria-labelledby="ft-title">
  <h2 id="ft-title" class="sr">Loomix footer</h2>

  <!-- Shared vector art (referenced by both the desktop and mobile views) -->
  <svg class="defs" aria-hidden="true" focusable="false">
    <defs>
      <!-- fan lines: dark hairlines that fade out as they enter the glow -->
      <linearGradient id="fanFade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="140">
        <stop offset="0" stop-color="#000" stop-opacity="1"/>
        <stop offset=".55" stop-color="#000" stop-opacity=".62"/>
        <stop offset="1" stop-color="#000" stop-opacity="0"/>
      </linearGradient>
      <!-- logo: neutral ramp (78°) + orange overlay ramp (30°), both fitted to the reference -->
      <linearGradient id="logoGray" gradientUnits="userSpaceOnUse" x1="128.91" y1="606.45" x2="158.01" y2="743.39"><stop offset="0.0286" stop-color="#303030"/><stop offset="0.2429" stop-color="#646464"/><stop offset="0.3571" stop-color="#8a8a8a"/><stop offset="0.4714" stop-color="#aeaeae"/><stop offset="0.5857" stop-color="#cacaca"/><stop offset="0.7000" stop-color="#dbdbdb"/><stop offset="0.8143" stop-color="#dedede"/><stop offset="0.9286" stop-color="#e1e1e1"/></linearGradient>
      <linearGradient id="logoOrange" gradientUnits="userSpaceOnUse" x1="773.36" y1="446.5" x2="872.95" y2="504.0">
        <stop offset="0" stop-color="#fc3c00" stop-opacity="0"/>
        <stop offset="1" stop-color="#ff3c00" stop-opacity="1"/>
      </linearGradient>
      <linearGradient id="div1" gradientUnits="userSpaceOnUse" x1="0" y1="545" x2="0" y2="964">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.13" stop-color="#fff" stop-opacity="0.125"/><stop offset="1" stop-color="#fff" stop-opacity="0.145"/>
      </linearGradient>
      <linearGradient id="div2" gradientUnits="userSpaceOnUse" x1="0" y1="462" x2="0" y2="964">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.13" stop-color="#fff" stop-opacity="0.1"/><stop offset="1" stop-color="#fff" stop-opacity="0.112"/>
      </linearGradient>

      <g id="art">
