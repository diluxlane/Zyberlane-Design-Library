<style>
@font-face{font-family:"Geist";src:url(asset/font-19f9c92546aa300c.woff2) format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"Anton";src:url(asset/font-d0fa07ff63dd60cb.woff2) format("woff2");font-weight:400;font-display:block}
:root{
  --lime:#DFFB72; --ink:#1A1A1A; --sky:#0a6fd0;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --display:"Anton","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  /* viewport height that ignores mobile browser chrome where supported */
  --vh:100vh;
}
@supports (height:100dvh){:root{--vh:100dvh}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#7cc3ee}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:geometricPrecision;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;user-select:none;-webkit-user-drag:none}

/* ============ Stage ============
   Design canvas = 1448 × 1086. --u is one design pixel in CSS px, chosen so the
   whole canvas fits the viewport (contain). Any leftover space (--ex / --ey) is
   distributed per group via its anchor (--fx / --fy), so edge-anchored groups
   stay on the edges, centred groups stay centred and the sky always bleeds to
   every edge — no letterboxing, no blank bands.                              */
.stage{position:relative;width:100%;isolation:isolate;overflow:clip}
.sky{position:absolute;inset:0;z-index:-1;background:#58b2ea url(asset/image-80ae420aa9e577be.webp) center bottom/cover no-repeat}
.g{position:absolute;width:calc(var(--gw)*var(--k));height:calc(var(--gh)*var(--k))}
.g>*,.e,.g .t{position:absolute;left:calc(var(--x)*var(--k));top:calc(var(--y)*var(--k))}
.e{width:calc(var(--w)*var(--k));height:calc(var(--h)*var(--k))}
.t{font-size:calc(var(--fs)*var(--k));letter-spacing:calc(var(--ls)*var(--k));line-height:1;white-space:nowrap;font-kerning:normal;font-feature-settings:"kern" 1}
.g img.e{max-width:none}
.skew{transform-origin:0 0}
.h1{display:contents;font:inherit}
p.g-tag{margin:0}

/* nav */
.navlink{transition:opacity .2s}
.navlink:hover{opacity:.75}
.btn-outline{border:calc(var(--bw)*var(--k)) solid rgba(255,255,255,.96);border-radius:999px;transition:background-color .2s,color .2s}
.btn-outline:hover{background:rgba(255,255,255,.12)}
/* cards */
.card{background:#1A1A1A;border-radius:calc(var(--r)*var(--k))}
.pill{background:var(--lime);border-radius:999px}
.vcard{border-radius:calc(var(--r)*var(--k));background:linear-gradient(71.7deg,rgb(143,219,129) 0%,rgb(116,207,136) 20%,rgb(79,192,140) 40%,rgb(64,185,142) 50%,rgb(36,173,144) 70%,rgb(8,163,147) 90%,rgb(0,158,148) 100%);box-shadow:0 6px 14px rgba(0,25,60,.22)}
.tile{border-radius:calc(var(--r)*var(--k));background:#0C756B}
.av{border-radius:50%;border:calc(2*var(--k)) solid #1A1A1A;background:#f4f4f4 50% 18%/114% no-repeat;background-clip:padding-box}
.av.plus{background:linear-gradient(180deg,#E9EDF1,#DCE1E6);background-clip:padding-box}
.cta{background:var(--lime);border-radius:999px;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.cta-dot{background:#1B1B1A;border-radius:50%;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.cta-link{position:absolute;inset:0;z-index:3;border-radius:999px}
.cta-link:hover~.cta{transform:translateY(-1px)}
.cta-link:hover~.cta-dot{transform:rotate(45deg)}
svg.e{overflow:visible}
:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:999px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Desktop / landscape composition ---------- */
@media (min-aspect-ratio:1/1) and (min-width:1000px) and (min-height:600px){
  html,body{overflow:hidden}
  .stage{height:var(--vh);
    --u:min(calc(100vw / 1448), calc(var(--vh) / 1086));
    --ex:calc(100vw - 1448 * var(--u));
    --ey:calc(var(--vh) - 1086 * var(--u));
    --k:var(--u)}
  .g{left:calc(var(--gx)*var(--u) + var(--fx)*var(--ex));top:calc(var(--gy)*var(--u) + var(--fy)*var(--ey))}
  header,nav,main,.cards{display:contents}
}

/* ---------- Portrait / small-screen composition ----------
   Same groups, re-flowed into a single column. Each group keeps its exact
   internal geometry and is scaled by its own unit.                         */
@media not all and (min-aspect-ratio:1/1) and (min-width:1000px) and (min-height:600px){
  .stage{min-height:var(--vh);display:flex;flex-direction:column;align-items:center;
    --m:clamp(.72px, calc(100vw / 430), 1.35px);
    padding:calc(18*var(--m)) 0 calc(40*var(--m))}
  .g{position:relative;flex:none}
  header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;width:min(100%, calc(430*var(--m)));padding:0 calc(14*var(--m))}
  .g-logo{--k:calc(var(--m)*.82);margin-left:calc(-6*var(--k))}
  .g-btn{--k:calc(var(--m)*.74);order:2;margin-right:calc(-6*var(--k))}
  nav{order:3;flex-basis:100%;display:flex;justify-content:center;margin-top:calc(6*var(--m))}
  .g-links{--k:calc(var(--m)*.86)}
  main{display:flex;flex-direction:column;align-items:center;width:100%}
  .g-center{--k:clamp(.42px, calc(100vw / 690), 1.02px);margin-top:calc(2*var(--m))}
  .g-tag{--k:calc(var(--m)*.76);margin-top:calc(-10*var(--m))}
  .cards{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:calc(22*var(--m)) calc(26*var(--m));margin-top:calc(30*var(--m));width:100%;padding:0 calc(12*var(--m))}
  .g-right{--k:var(--m);order:1}
  .g-left{--k:var(--m);order:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* First-load foreground sequence. The sky image remains completely still. */
@keyframes wingly-quiet{
  from{opacity:0;transform:translate3d(0,8px,0)}
  to{opacity:1;transform:none}
}
@keyframes wingly-type{
  from{clip-path:inset(0 0 100% 0)}
  to{clip-path:inset(0 0 0 0)}
}
@keyframes wingly-fade{
  from{opacity:0}
  to{opacity:1}
}

  .g-center > .cta,.g-center > .cta-dot,.g-center > .t,.g-center > svg.e{animation:wingly-fade .6s cubic-bezier(.22,1,.36,1) .9s backwards}

  .g-right{animation:wingly-quiet .76s cubic-bezier(.22,1,.36,1) .78s backwards}
}
