@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* One opening sequence. The light and all background layers stay fixed. */
@media (prefers-reduced-motion: no-preference) {
  .entrance .rail .logo {
    animation: entrance-rail .48s cubic-bezier(.22, 1, .36, 1) .06s both;
  }
  .entrance .rail .key-new,
  .entrance .rail .key-user,
  .entrance .rail .nav-ico {
    animation: entrance-rail .54s cubic-bezier(.22, 1, .36, 1) .19s both;
  }
  .entrance h1.t span {
    animation: entrance-title .84s cubic-bezier(.16, 1, .3, 1) both;
  }
  .entrance h1.t span:first-child { animation-delay: .31s; }
  .entrance h1.t span:last-child { animation-delay: .45s; }
  .entrance .sub {
    animation: entrance-copy .58s cubic-bezier(.22, 1, .36, 1) .76s both;
  }
  .entrance .btn-apple {
    animation: entrance-control .68s cubic-bezier(.22, 1, .36, 1) .94s both;
  }
  .entrance .btn-google {
    animation: entrance-control .68s cubic-bezier(.22, 1, .36, 1) 1.07s both;
  }
  .entrance .divider {
    animation: entrance-rule .48s cubic-bezier(.22, 1, .36, 1) 1.17s both;
  }
  .entrance .field {
    animation: entrance-control .68s cubic-bezier(.22, 1, .36, 1) 1.30s both;
  }
  .entrance .btn-dim {
    animation: entrance-control .68s cubic-bezier(.22, 1, .36, 1) 1.42s both;
  }
  .entrance .close {
    animation: entrance-copy .48s cubic-bezier(.22, 1, .36, 1) 1.66s both;
  }
  @media (max-aspect-ratio: 1/1) {
    .entrance .rail .nav-ico { animation: none; }
    .entrance .rail .dock {
      animation: entrance-dock .54s cubic-bezier(.22, 1, .36, 1) .19s both;
    }
  }
}
@keyframes entrance-rail {
  from { opacity: 0; translate: -5px 0; }
  to { opacity: 1; translate: none; }
}
@keyframes entrance-dock {
  from { opacity: 0; translate: 0 7px; }
  to { opacity: 1; translate: none; }
}
@keyframes entrance-title {
  from { opacity: .55; clip-path: inset(0 0 100% 0); translate: 0 11px; }
  to { opacity: 1; clip-path: inset(0 0 0 0); translate: none; }
}
@keyframes entrance-copy {
  from { opacity: 0; translate: 0 6px; }
  to { opacity: 1; translate: none; }
}
@keyframes entrance-control {
  from { opacity: 0; translate: 0 9px; }
  to { opacity: 1; translate: none; }
}
@keyframes entrance-rule {
  from { clip-path: inset(0 100% 0 0); }
  to { clip-path: inset(0 0 0 0); }
}
</style>
</head>
<body>
<div class="app">
  <div class="light" aria-hidden="true">
    <div class="left-glow"></div>
    <div class="beam">
      <div class="halo"></div>
      <div class="cone cone-0"></div>
      <div class="cone cone-1"></div>
    </div>
  </div>

  <aside class="rail" aria-label="Primary">
    <a class="logo" href="#" aria-label="Insight AI home"><svg viewBox="0 0 44 40"><path d="M38.00 31.21A1.93 1.93 0 0 1 41.07 29.65L50.52 36.63A1.93 1.93 0 0 1 49.72 40.08L27.18 44.24A1.93 1.93 0 0 0 26.26 47.60L34.95 55.16A1.93 1.93 0 0 0 38.15 53.69Z" transform="translate(-14 -22)"/></svg></a>
    <button class="glass-key key-new" type="button" aria-label="New chat">
      <svg viewBox="0 0 24 24" style="width:calc(24 * var(--u));height:calc(24 * var(--u));transform:translate(calc(-0.2 * var(--u)),calc(0.95 * var(--u)))"><path d="M12 4.6V19.4M4.6 12H19.4" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"/></svg>
    </button>
    <nav class="dock">
      <a class="nav-ico ico-doc" href="#" aria-label="Library"><svg viewBox="0 0 24 24"><g class="s"><path d="M18.88 10.4V5.4a3 3 0 0 0-3-3H6.35a3 3 0 0 0-3 3v12.66a3 3 0 0 0 3 3h3.95"/>
      <path d="M7.65 6.75h6.05M7.65 10.6h2.05"/><circle cx="15.83" cy="16.75" r="4.65"/>
      <path d="M15.25 17.35l1.35-1.3" stroke-width="1.6"/></g></svg></a>
      <a class="nav-ico ico-compass" href="#" aria-label="Discover"><svg viewBox="0 0 24 24"><g class="s"><circle cx="11.9" cy="12.45" r="9.3"/>
      <path d="M5.2 17.2L9.15 10.35L16.7 7.3L12.65 14.2Z"/></g></svg></a>
      <a class="nav-ico ico-grid" href="#" aria-label="Apps"><svg viewBox="0 0 24 24"><g class="s"><rect x="2.5" y="3.05" width="7.45" height="7.6" rx="3.1"/><rect x="13.5" y="3.05" width="7.5" height="7.7" rx="3.1"/>
      <rect x="2.5" y="14.4" width="7.45" height="7.2" rx="3.1"/><rect x="13.5" y="14.4" width="7.5" height="7.2" rx="3.1"/></g></svg></a>
      <a class="nav-ico ico-chart" href="#" aria-label="Analytics"><svg viewBox="0 0 24 24"><g class="s"><path d="M3.33 14.35V19.95M8.9 12.15V19.95M14.83 13.0V19.95M20.4 9.95V19.95"/>
      <path d="M3.1 10.8L7.45 7.15L12.5 9.65L19.6 3.3"/><path d="M17.3 2.95H20.35V6.0"/></g></svg></a>
      <a class="nav-ico ico-more" href="#" aria-label="More"><svg class="dots" viewBox="0 0 24 24"><circle cx="5.78" cy="12.5" r="1.75"/><circle cx="11.95" cy="12.5" r="1.75"/><circle cx="18.34" cy="12.5" r="1.75"/></svg></a>
    </nav>
    <button class="glass-key key-user" type="button" aria-label="Account">
      <svg viewBox="0 0 24 24" style="width:calc(24 * var(--u));height:calc(24 * var(--u));transform:translate(0,calc(-0.15 * var(--u)))"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11.93" cy="9.0" r="4.58"/><path d="M4.35 19.9C4.35 16.4 7.75 14.15 11.9 14.15S19.45 16.4 19.45 19.9"/></g></svg>
    </button>
  </aside>

  <main class="auth" role="main">
    <h1 class="t"><span>Sign up below to unlock the</span><span>full potential of Insight AI.</span></h1>
    <p class="t sub">By continuing, you agree to our <a href="#">privacy policy</a>.</p>

    <button class="btn btn-light btn-apple" type="button">
      <svg class="apple-ico" viewBox="2.225 0 19.55 24" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
      <span class="lbl">Continue with Apple</span>
    </button>
    <button class="btn btn-light btn-google" type="button">
      <svg class="google-ico" viewBox="-0.193 -0.5 24.386 25" aria-hidden="true"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z" stroke="currentColor" stroke-width="1.0" stroke-linejoin="round"/></svg>
      <span class="lbl">Continue with Google</span>
    </button>

    <div class="divider" role="separator"></div>

    <label class="field">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.6 4.65H18.1a2.95 2.95 0 0 1 2.95 2.95v9.8a2.95 2.95 0 0 1-2.95 2.95H5.6a2.95 2.95 0 0 1-2.95-2.95V7.6A2.95 2.95 0 0 1 5.6 4.65Z"/><path d="M5.35 8.45L11.65 12.45L18.3 8.3"/></svg>
      <input type="email" name="email" placeholder="enter your mail" autocomplete="email" aria-label="Email address">
    </label>

    <button class="btn btn-dim" type="button" disabled><span class="lbl">Continue with email</span></button>
    <button class="t close" type="button">Close</button>
  </main>
</div>
<script>
  // The last reveal completes the sequence; remove all animation rules so
  // every foreground element returns to its original authored style.
  (function () {
    if (!document.documentElement.classList.contains('entrance')) return;
    var last = document.querySelector('.close');
    var timeout = setTimeout(finish, 2600);
    last.addEventListener('animationend', finish, { once: true });
    function finish() {
      clearTimeout(timeout);
      last.removeEventListener('animationend', finish);
      document.documentElement.classList.remove('entrance');
    }
  })();

  // enable the email CTA once the address looks valid
  (function () {
    var input = document.querySelector('.field input'), cta = document.querySelector('.btn-dim');
    input.addEventListener('input', function () {
      var ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value.trim());
      cta.disabled = !ok; cta.classList.toggle('ready', ok);
    });
  })();
</script>
</body>
</html>
