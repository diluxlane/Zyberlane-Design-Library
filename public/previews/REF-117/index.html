<script>
/* Responsive stage.
 * The composition is authored at 1391 x 1131 design px. Every element keeps its
 * authored position; the engine only translates/scales it.
 *  - Landscape / desktop: one uniform scale fits the frame, then elements are
 *    pinned to the edge they belong to (nav to the top corners, the hero to the
 *    centre, the footer row to the bottom corners), so the texture and the
 *    composition always reach every edge - no letterbox bars.
 *  - Portrait / phone: the same elements are recomposed into a vertical stack
 *    (headline, capsules, tagline, CTA) with the free height distributed.
 */
(function () {
  var BW = 1391, BH = 1131;
  var root = document.documentElement;
  var vp = document.getElementById('vp');
  var stage = document.getElementById('stage');
  var sizer = document.getElementById('sizer');
  var els = Array.prototype.slice.call(stage.querySelectorAll('.el'));
  var $ = function (id) { return document.getElementById(id); };
  var natural = new Map();

  function nat(el) {             // authored box, unaffected by transforms
    if (!natural.has(el)) natural.set(el, { x: el.offsetLeft, y: el.offsetTop });
    return natural.get(el);
  }
  function put(el, X, Y, k, sx) {  // move element's authored box to (X,Y) and scale it by k
    var n = nat(el); k = k || 1; sx = sx || parseFloat(el.dataset.sx || '1');
    el.style.transform = 'translate(' + (X - n.x) + 'px,' + (Y - n.y) + 'px) scale(' + (k * sx) + ',' + k + ')';
  }

  function frame(s, W, H, left, scroll) {
    stage.style.width = W + 'px';
    stage.style.height = H + 'px';
    stage.style.left = left + 'px';
    stage.style.transform = 'scale(' + s + ')';
    sizer.style.height = Math.ceil(H * s) + 'px';
    vp.classList.toggle('scroll', !!scroll);
  }

  function desktop(vw, vh) {
    root.classList.remove('m');
    var fit = Math.min(vw / BW, vh / BH), s = fit;
    // very short landscape screens (phones on their side): keep text legible and scroll instead
    if (vh < 560 && vw / BW > fit * 1.2) s = Math.min(vw / BW, Math.max(fit, 0.56));
    var Wv = vw / s, Hv = vh / s;
    var W = Math.min(Wv, BW * 1.75);          // ultra-wide: stop spreading, centre the frame
    var H = Math.max(Hv, BH);
    var dx = { l: 0, c: (W - BW) / 2, r: W - BW };
    var dy = { t: 0, m: (H - BH) / 2, b: H - BH };
    els.forEach(function (el) {
      var n = nat(el);
      put(el, n.x + dx[el.dataset.ax || 'l'], n.y + dy[el.dataset.ay || 't'], 1);
    });
    frame(s, W, H, (Wv - W) / 2 * s, H > Hv + 0.5);
  }

  function mobile(vw, vh) {
    root.classList.add('m');
    var tag = $('tag'), see = $('see');
    var pad = 22;
    // ink offsets inside the authored text boxes (design px)
    var collInkTop = 11.9, collInkBot = 71.9, collInkR = 338.8;
    var newInkTop = 34.5, newInkBot = 158.5, newInkL = 6.6;

    function plan(s) {
      var W = vw / s, Hv = vh / s;
      var g = Math.min(0.56, (W - 2 * pad + 10) / 772);       // capsules fill the width
      var kc = 1.42 * g, kn = 1.48 * g;                        // headline follows the capsules
      kc = Math.min(kc, (W - 2 * pad) / collInkR);
      root.style.setProperty('--tagw', Math.min(W - 2 * pad - 10, 380) + 'px');
      var tagH = tag.offsetHeight;
      var tN = collInkBot * kc + 18 * g - newInkTop * kn;      // New sits under Collection
      var hy = tN + newInkBot * kn - 72 * g;                   // and overlaps the capsule tops
      var heroH = hy + (836 - 199) * g;
      var header = 78, bottomH = tagH + 30 + 57;
      var fixed = header + heroH + bottomH + 26;
      return { s: s, W: W, Hv: Hv, g: g, kc: kc, kn: kn, tagH: tagH, tN: tN, hy: hy, heroH: heroH,
               header: header, bottomH: bottomH, fixed: fixed };
    }
    // largest scale (<= 1 design px per 430th of the width) whose stack still fits the screen
    var s = Math.min(vw / 430, 1.85), P = plan(s), sMin = vw / 640;
    while (P.fixed + 40 > P.Hv && s > sMin) { s = Math.max(sMin, s * 0.97); P = plan(s); }
    var W = P.W, Hv = P.Hv, cx = W / 2, g = P.g;
    var free = Math.max(0, Hv - P.fixed - 40);
    var H = Math.max(Hv, P.fixed + 40);
    var top = P.header + 10 + free * 0.30;
    var bTop = top + P.heroH + 30 + free * 0.36;

    // header: menu, logo riding on the black bar, bag
    var kl = Math.min(0.66, (105.7 * g - 6) / 69.8);
    put($('logo'), cx - 72 * kl / 2, 20, kl);
    put($('burger'), pad - 2, 30, 1.15);
    put($('bag'), W - pad - 24 * 1.15 + 2, 30, 1.15);

    // headline + capsules
    put($('coll'), W - pad - collInkR * P.kc, top - collInkTop * P.kc, P.kc);
    put($('new'), pad - newInkL * P.kn, top + P.tN, P.kn);
    put($('hero'), cx - 695.27 * g, top + P.hy - 199 * g, g);

    // footer: tagline, CTA, edge stars framing the CTA
    var tagW = tag.offsetWidth;
    put(tag, cx - tagW / 2, bTop, 1);
    var rowY = bTop + P.tagH + 30;
    put(see, cx - see.offsetWidth / 2, rowY, 1);
    var kd = 0.62, rowCY = rowY + 28.5;
    put($('decoL'), -2, rowCY - 116 * kd, kd);
    put($('decoR'), W - 611 * kd + 2, rowCY - 116 * kd, kd);

    frame(P.s, W, H, 0, H > Hv + 0.5);
  }

  function layout() {
    var vw = vp.clientWidth || window.innerWidth, vh = vp.clientHeight || window.innerHeight;
    if (vw / vh < 0.8 || vw < 700) mobile(vw, vh); else desktop(vw, vh);
    stage.classList.add('ready');
  }

  // menu (portrait)
  var menu = $('menu'), burger = $('burger');
  function setMenu(open) {
    menu.classList.toggle('open', open);
    menu.setAttribute('aria-hidden', open ? 'false' : 'true');
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  burger.addEventListener('click', function () { setMenu(true); });
  menu.addEventListener('click', function (e) { if (e.target === menu || e.target.closest('.close') || e.target.tagName === 'A') setMenu(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setMenu(false); });

  var raf = 0;
  function schedule() { cancelAnimationFrame(raf); raf = requestAnimationFrame(layout); }
  window.addEventListener('resize', schedule);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', schedule);
  layout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

  // One opening composition. Animate only paint properties so the responsive
  // stage transforms remain authoritative; cancel every effect at the end.
  if (Element.prototype.animate && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var entrance = [];
    var ease = 'cubic-bezier(0.22, 1, 0.36, 1)';
    function reveal(element, frames, delay, duration, easing) {
      entrance.push(element.animate(frames, {
        delay: delay, duration: duration, easing: easing || ease, fill: 'both'
      }));
    }

    // The fixed texture stays still. The foreground artwork opens down its
    // central ribbon, followed by the two words and the supporting content.
    reveal($('hero'), [
      { clipPath: 'inset(0 0 100% 0)' },
      { clipPath: 'inset(0 0 0% 0)' }
    ], 0, 1260);
    reveal($('logo'), [{ opacity: 0 }, { opacity: 1 }], 180, 520);
    reveal(stage.querySelector('nav'), [{ opacity: 0 }, { opacity: 1 }], 220, 480);
    reveal($('new'), [
      { clipPath: 'inset(100% 0 0 0)', opacity: 0.65 },
      { clipPath: 'inset(0% 0 0 0)', opacity: 1 }
    ], 390, 830);
    reveal($('coll'), [
      { clipPath: 'inset(100% 0 0 0)', opacity: 0.65 },
      { clipPath: 'inset(0% 0 0 0)', opacity: 1 }
    ], 560, 790);
    reveal($('tag'), [{ opacity: 0 }, { opacity: 1 }], 1030, 520);
    reveal($('see'), [
      { clipPath: 'inset(0 100% 0 0)', opacity: 0.7 },
      { clipPath: 'inset(0 0% 0 0)', opacity: 1 }
    ], 1160, 670);
    reveal($('decoL'), [{ opacity: 0 }, { opacity: 1 }], 1270, 520);
    reveal($('decoR'), [{ opacity: 0 }, { opacity: 1 }], 1270, 520);

    Promise.allSettled(entrance.map(function (animation) { return animation.finished; }))
      .then(function () { entrance.forEach(function (animation) { animation.cancel(); }); });
  }
})();

</script>
