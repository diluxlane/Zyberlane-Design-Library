/* =====================================================================
   RESPONSIVE ARCHITECTURE
   Desktop (base styles above) = the 1280×800 composition scaled uniformly by
   u = min(vw/1280, vh/800). It stays active while u ≥ 0.9, i.e. while body copy
   is ≥16.2px, the smallest labels ≥10.8px and the CTAs ≥46px tall (touch-safe).
   That is exactly (min-width:1152px) and (min-height:720px).
   Below that the composition stops shrinking and re-flows instead.
   ===================================================================== */

/* ---------- Tablet: 511px → desktop threshold (either axis) ----------
   Same centred column, same components, frozen at the desktop's threshold
   scale (k = .9) so the hand-off from desktop is size-continuous; the
   headline and spacing then flex with the space that is actually available. */
@media (min-width:511px) and (max-width:1151.98px), (min-width:511px) and (max-height:719.98px){
  :root{--k:.9;--gut:clamp(32px,5vw,48px)}
  .hero{height:auto;min-height:var(--vh)}
  .nav-l,.nav-r{transform:scale(var(--k))}
  .stage{position:relative;left:auto;top:auto;width:auto;height:auto;transform:none;
    display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:calc(clamp(70px,12.47vh,89.8px) + env(safe-area-inset-top,0px)) var(--gut) 0}
  .pill,h1,.lede,.cta{position:relative;left:auto;top:auto;transform:none}
  /* components keep their exact desktop build; zoom scales layout + paint together */
  .pill,.cta{zoom:var(--k)}
  .pill span,.btn span{left:0;top:var(--cap-shift)}
  /* one-line headline: shrinks with the column, never below 40px */
  h1{width:auto;margin-top:min(calc(24.44px * var(--k)),2.9vh);
    font-size:clamp(40px,calc((100vw - 2 * var(--gut)) / 16.4),calc(53px * var(--k)))}
  /* keeps the desktop's three authored line breaks; eases down only if the longest line would not fit */
  .lede{width:auto;margin-top:min(calc(24px * var(--k)),2.85vh);
    font-size:min(calc(18px * var(--k)),calc((100vw - 2 * var(--gut)) / 27.9));line-height:1.278}
  .cta{margin-top:min(21.05px,2.8vh)}
  /* touch: extend the hit area of the compact controls to ≥44px without changing how they look */
  .more::after,.pill::after{content:"";position:absolute;inset:-6px -2px}
}
/* Narrow tablet: a 40px single line no longer fits → balanced two-line headline */
@media (min-width:511px) and (max-width:719.98px){
  h1{white-space:normal;font-size:clamp(40px,6.9vw,46px);line-height:1.06;max-width:9.6em;text-wrap:balance}
}

/* Portrait tablet: height is plentiful, width is the constraint → components return to their
   true 1:1 desktop size and the headline becomes a balanced two-line lock-up that uses the
   width, so the type (not the photograph) stays the dominant element. */
@media (min-width:511px) and (max-width:1151.98px) and (orientation:portrait){
  :root{--k:1}
  .stage{padding-top:calc(clamp(96px,10.5vh,150px) + env(safe-area-inset-top,0px))}
  h1{white-space:normal;font-size:clamp(44px,7.6vw,78px);line-height:1.04;max-width:9.6em;text-wrap:balance;margin-top:clamp(24px,2.6vh,34px)}
  .lede{margin-top:clamp(22px,2.4vh,30px)}
  .cta{margin-top:clamp(24px,2.6vh,34px)}
}

/* ---------- Phone: < 511px ----------
   Why 511: the tablet column keeps the desktop's three authored lede lines and eases the copy
   down to fit them; below 511px that would push body text under 16px (15.6px at 500, 13.1px at
   430), and the paired CTAs would reach the gutter at ~449px and overflow at ~390px.
   Phone architecture = same centred column, same components, but the copy re-wraps naturally,
   the headline keeps its two-line lock-up sized to the width, and the CTA pair stays side by side
   (tightening only its inner padding) until it genuinely cannot, then stacks as an equal pair. */
@media (max-width:510.98px){
  :root{--gut:clamp(20px,5.5vw,24px)}
  .hero{height:auto;min-height:100svh;min-height:var(--vh)}
  .nav-l,.nav-r{transform:scale(.88);top:env(safe-area-inset-top,0px)}
  .stage{position:relative;left:auto;top:auto;width:auto;height:auto;transform:none;
    display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:calc(clamp(80px,10.5vh,94px) + env(safe-area-inset-top,0px)) var(--gut) 0}
  .pill,h1,.lede,.cta{position:relative;left:auto;top:auto;transform:none}
  .pill span,.btn span{left:0;top:var(--cap-shift)}
  .pill{zoom:.86}
  /* Compact phone typography: retains the authored hierarchy without carrying
     tablet-scale type and controls into the narrow viewport. */
  h1{width:auto;margin-top:clamp(17px,2.2vh,21px);white-space:normal;
    font-size:clamp(32px,9.25vw,37px);line-height:1.06;max-width:9.6em;text-wrap:balance}
  .lede{width:auto;margin-top:clamp(13px,1.8vh,16px);font-size:clamp(14px,3.72vw,15px);line-height:1.42;max-width:32em;text-wrap:pretty}
  br.d{display:none}
  .cta{margin-top:clamp(18px,2.4vh,22px);gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:330px}
  .btn{height:46px;flex:1 1 auto;justify-content:center;font-size:11.5px;letter-spacing:.35px}
  .b1{padding:0 clamp(13px,3.5vw,20px)}
  .b2{padding:0 calc(clamp(13px,3.5vw,20px) - .34px) 0 calc(clamp(13px,3.5vw,20px) + .34px)}
  .b2 svg{width:11px;height:11px;margin-right:clamp(12px,3.5vw,16px)}
  /* touch: ≥44px hit areas for the compact controls, visuals unchanged */
  .more::after,.pill::after{content:"";position:absolute;inset:-8px -4px}
  .pill{position:relative}
}


/* ---------- Entrance (runs once on load; nothing here applies at rest) ----------
   html.intro only exists from first paint until the timeline has been built (a few ms),
   and is removed by a failsafe even if the script never runs. */
html.intro .brand,html.intro .more,html.intro .rail,html.intro .pill,html.intro h1,html.intro .lede,html.intro .btn{opacity:0}
.rail{transform-origin:50% 0}
/* temporary word masks for the headline reveal — padding/negative-margin pairs keep the

h1 .w{display:inline-block;overflow:hidden;vertical-align:top;padding:.08em 0 .2em;margin:-.08em 0 -.2em}
h1 .w>span{display:inline-block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
/* Layout engine — mode is owned by CSS; JS only supplies what CSS cannot compute:
   the unitless desktop scale u, the dynamic viewport height, and the photo placement.
   Desktop : 1280×800 composition scaled by u = min(vw/1280, vh/800) — exact 1:1 at 1280×800.
   Tablet  : re-flowed column at scale k = .9 (the desktop threshold scale).
   Phone   : re-flowed column at 1:1.
   Photo   : always covers the whole hero. Scaled/placed so the subject's crown sits a fixed gap
             below the CTA row, as in the reference; on very tall screens the subject is capped at
             1.4× cover and the remaining height is carried by the matching sky tone. */
(function(){
  var R=document.documentElement,hero=document.getElementById('hero'),photo=document.getElementById('photo'),cta=document.getElementById('cta');
  var IW=1586,IH=992,CROWN=530,GAP_D=49.24,GAP_M=26,OVERSCAN=1.00078,K_T=.9,MAX_ZOOM=1.4; /* overscan+gap registered against the reference photo to ±0.5px */
  var DESK=matchMedia('(min-width:1152px) and (min-height:720px)'), PHONE=matchMedia('(max-width:510.98px)');
  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
  function layout(){
    var vw=R.clientWidth, vh=window.innerHeight;
    var mode=DESK.matches?'d':(PHONE.matches?'m':'t');
    var u=Math.min(vw/1280,vh/800);
    R.style.setProperty('--u',u); R.style.setProperty('--vh',vh+'px');
    var H=hero.offsetHeight, top=hero.getBoundingClientRect().top;
    var cb=cta.getBoundingClientRect().bottom-top;
    var k=parseFloat(getComputedStyle(R).getPropertyValue('--k'))||K_T;
    var crown=cb+(mode==='d'?GAP_D*u:mode==='t'?GAP_D*k:GAP_M);
    var cover=Math.max(vw/IW, H/IH);
    var s=Math.max(cover,(H-crown)/(IH-CROWN));
    if(s>cover*MAX_ZOOM){s=cover*MAX_ZOOM;crown=H-(IH-CROWN)*s;}
    s*=OVERSCAN;
    var fx=(vw/H<1)?815:IW/2;
    var x0=clamp(vw/2-fx*s, vw-IW*s, 0);
    var y0=crown-CROWN*s;
    photo.style.setProperty('--s',s); photo.style.setProperty('--x0',x0+'px'); photo.style.setProperty('--y0',y0+'px');
  }
  var raf=0;function schedule(){cancelAnimationFrame(raf);raf=requestAnimationFrame(layout)}
  layout();
  addEventListener('resize',schedule,{passive:true});
  if(window.visualViewport) visualViewport.addEventListener('resize',schedule,{passive:true});
  DESK.addEventListener&&DESK.addEventListener('change',schedule); PHONE.addEventListener&&PHONE.addEventListener('change',schedule);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layout);
  if('ResizeObserver' in window) new ResizeObserver(schedule).observe(document.getElementById('stage'));
})();
</script>
<script>
/* =====================================================================
   ENTRANCE — one choreographed timeline, Web Animations API, no dependencies.
   The photograph is the stage and never moves; only foreground content performs.

   Motion vocabulary
     A  Type reveal     headline words rise inside their own masks (expo-out)
     B  Copy settle     lede: short rise + fade
     C  Surface wipe    glass/solid surfaces open like a shutter: the pill left→right
                        (its reading direction, toward its » arrow), the CTAs bottom→top
     D  Chrome drop     logo + MORE ease down from the top edge; the rail draws itself

   Timeline (s)   0.15 logo · 0.25 MORE · 0.30 pill wipe · 0.35 rail
                  0.45→0.67 headline words · 0.85 lede · 1.05 / 1.13 CTAs · done ≈1.95
   Every tween uses fill:"backwards" → once finished it leaves no trace; the page's
   own CSS is the final frame. Afterwards the headline's DOM is restored verbatim.
   ===================================================================== */
(function(){
  var R=document.documentElement;
  if(!R.classList.contains('intro')) return;
  var EXPO='cubic-bezier(.16,1,.3,1)', QUART='cubic-bezier(.25,1,.5,1)', SHUTTER='cubic-bezier(.76,0,.24,1)';
  var q=function(s){return document.querySelector(s)};
  var anims=[];
  function tw(el,kf,delay,dur,ease){
    anims.push(el.animate(kf,{delay:delay*1000,duration:dur*1000,easing:ease,fill:'backwards'}));
  }
  function run(){
    var phone=matchMedia('(max-width:510.98px)').matches, d=phone?.75:1; /* shorter travel on phones */
    var h1=q('h1'), original=h1.innerHTML;
    // wrap headline words in masks (text + wrapping identical; restored at the end)
    h1.innerHTML=h1.textContent.trim().split(/\s+/).map(function(w){return '<span class="w"><span>'+w+'</span></span>'}).join(' ');

    // D — chrome
    tw(q('.brand'),[{opacity:0,translate:'0 '+(-8*d)+'px'},{opacity:1,translate:'0 0'}],.15,.8,QUART);
    tw(q('.more'), [{opacity:0,translate:'0 '+(-8*d)+'px'},{opacity:1,translate:'0 0'}],.25,.8,QUART);
    tw(q('.rail'), [{scale:'1 0'},{scale:'1 1'}],.35,.9,EXPO);
    // C — eyebrow pill opens toward its arrow
    tw(q('.pill'), [{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)'}],.30,.75,SHUTTER);
    // A — headline, word by word inside masks
    h1.querySelectorAll('.w>span').forEach(function(el,i){
      tw(el,[{translate:'0 132%'},{translate:'0 0'}],.45+i*.055,1.05,EXPO);
    });
    // B — supporting copy
    tw(q('.lede'), [{opacity:0,translate:'0 '+(12*d)+'px'},{opacity:1,translate:'0 0'}],.85,.9,QUART);
    // C — CTAs rise into place from their own base, label follows a beat later
    [['.b1',1.05],['.b2',1.13]].forEach(function(b){
      var el=q(b[0]);
      tw(el,[{clipPath:'inset(100% 0 0 0)'},{clipPath:'inset(0% 0 0 0)'}],b[1],.75,EXPO);
      tw(el.querySelector('span'),[{opacity:0,translate:'0 '+(8*d)+'px'},{opacity:1,translate:'0 0'}],b[1]+.1,.7,QUART);
      var ic=el.querySelector('svg'); if(ic) tw(ic,[{opacity:0,translate:'0 '+(8*d)+'px'},{opacity:1,translate:'0 0'}],b[1]+.1,.7,QUART);
    });

    // from-states are now held by the animations themselves → reveal the layer (same frame)
    R.classList.remove('intro');

    // restore the headline's authored markup the moment its words are at rest
    // (while the CTAs are still settling, so the swap is never looked at)
    var words=anims.filter(function(a){return a.effect.target.parentNode&&a.effect.target.parentNode.classList.contains('w')});
    Promise.all(words.map(function(a){return a.finished})).then(function(){ h1.innerHTML=original; });
    Promise.all(anims.map(function(a){return a.finished})).then(function(){
      anims.forEach(function(a){a.cancel()}); anims=[]; // release; nothing keeps running
      R.classList.add('intro-done');
    });
  }
  var start=function(){requestAnimationFrame(run)};
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(start,start);
})();
</script>
