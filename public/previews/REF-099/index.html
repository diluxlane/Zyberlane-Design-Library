/* ------------------------------------------------------------------
   Design tokens (sampled from the reference, 1672 x 941 artboard)
   ------------------------------------------------------------------ */
:root {
  --art-w: 1672;            /* artboard width  (design px) */
  --art-h: 941;             /* artboard height (design px) */
  --white: #ffffff;
  --ink: #000000;
  --orange-hi: #fd7d13;     /* glow, lower right   (253,125,19) */
  --orange: #f6650e;        /* mid field           (246,101,14) */
  --orange-lo: #d5490b;     /* top-right corner    (213,73,11)  */
  --glass-line: rgba(255,255,255,0.6);
  /* JS keeps these in sync with the viewport; the values below are
     the no-JS fallback for the reference 16:9 frame. */
  --s: 1; --sw: 1672; --sh: 941; --ex: 0; --exw: 0;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
html { background: var(--orange); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  overflow: hidden;
  font-family: "KaruSans", "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-optical-sizing: auto;
  color: var(--white);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: geometricPrecision;
}

/* Full-bleed viewport frame: always exactly the viewport, never letterboxed */
.hero {
  position: fixed; inset: 0;
  width: 100vw; height: 100vh; height: 100dvh;
  overflow: hidden;
  isolation: isolate;
  /* gradient field: 5th-order surface fitted to the reference (RMSE < 2/255) */
  background:
    url(assets/hero-texture.png) center / 100% 100% no-repeat,
    radial-gradient(120% 110% at 62% 100%, var(--orange-hi) 0%, var(--orange) 45%, var(--orange-lo) 100%);
}

/* Artboard: design-px coordinate system, scaled uniformly to the viewport.
   Its size in design px is (viewport / s), so it always covers the viewport
   edge to edge; extra room appears as --ex (height) / --exw (width). */
.art {
  position: absolute; left: 0; top: 0;
  width: calc(var(--sw) * 1px);
  height: calc(var(--sh) * 1px);
  transform: scale(var(--s));
  transform-origin: 0 0;
}
.art > * { position: absolute; }
.stack { left: 0; top: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
.stack > * { position: absolute; pointer-events: auto; }
.is-portrait .stack { width: auto; height: auto; top: auto; }

/* ---------------- Wordmark ---------------- */
.wordmark {
  left: 90.4px; top: 46.4px;
  width: 1395.1px; height: 299.8px;
  z-index: 1; display: block; overflow: visible;
  fill: var(--white);
}

/* ---------------- Figure (in front of wordmark) ---------------- */
.figure {
  --fh: max(1061.376px, calc(var(--sh) * 1px - 60px));
  top: 60px;
  height: var(--fh);
  width: calc(var(--fh) * 0.867);
  left: calc(842.1px - var(--fh) * 0.867 * 0.513);
  z-index: 2;
  pointer-events: none; user-select: none;
  -webkit-user-drag: none;
}

/* ---------------- Left column ---------------- */
.headline {
  left: 93.0px; top: calc(429.4px + var(--ex) * 0.5 * 1px);
  font-size:51.623px;letter-spacing:2.851px;line-height:51.33px;font-weight:550;transform:scaleX(1.046);transform-origin:0 0;
  text-transform: uppercase; white-space: nowrap; z-index: 3;
  font-variation-settings: "opsz" 14;
}
.headline span { display: block; letter-spacing: calc(2.851px + var(--lls, 0px)); margin-left: var(--lind, 0px); }

.cta {
  left: 95.3px; top: calc(651.6px + var(--ex) * 0.5 * 1px);
  width: 354.5px; height: 59.3px;
  background: var(--ink); color: var(--white);
  text-decoration: none; z-index: 3;
  display: block;
}
.cta__label {
  position: absolute; left: 24.5px; top: 20.6px;
  font-size:20.0px;letter-spacing:-1.3px;line-height:20px;font-weight:450;
  white-space: nowrap; text-transform: uppercase;
  font-variation-settings: "opsz" 14;
}
.cta__icon {
  position: absolute; left: 310.0px; top: 22.0px;
  width: 16px; height: 16px; overflow: visible;
}
.cta:hover { background: #111; }
.cta:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }

/* ---------------- Right column ---------------- */
.studio {
  right: calc(1672px - 1125px - 480px);
  top: calc(428.0px + var(--ex) * 0.5 * 1px);
  width: 480px; height: 200px;
  font-size:99.1px;letter-spacing:1.329px;line-height:97.0px;font-weight:500;
  font-variation-settings: "opsz" 14;
  white-space: nowrap; text-transform: uppercase; z-index: 3;
  padding-left: 12.0px;
  /* diagonal opacity ramp, measured: 0.30 (lower-left of S) -> 1.0 */
  color: transparent;
  background: linear-gradient(61.4deg, rgba(255,255,255,0.0) 12px, #fff 150px);
  -webkit-background-clip: text; background-clip: text;
}
.studio span { display: block; letter-spacing: calc(1.329px + var(--lls, 0px)); margin-left: var(--lind, 0px); }

.lede {
  right: calc(1672px - 1137.0px - 480px);
  top: calc(636.7px + var(--ex) * 0.5 * 1px);
  width: 480px;
  font-size:18.062px;letter-spacing:-0.924px;line-height:26.0px;font-weight:366;
  font-variation-settings: "opsz" 14;
  z-index: 3;
  transform: scale(var(--tb, 1)); transform-origin: 100% 0;
}
.lede span { display: block; white-space: nowrap; }
.lede b { font-weight: 700; }

/* ---------------- Clock ---------------- */
.clock {
  right: calc(1672px - 1506.0px - 120px);
  bottom: 47.0px;
  width: 120px;
  z-index: 3; white-space: nowrap;
  transform: scale(var(--tb, 1)); transform-origin: 100% 100%;
}
.clock__time { display:block; font-size:24.3px;letter-spacing:-0.333px;line-height:28px;font-weight:550; font-variation-settings: "opsz" 14; }
.clock__city { display:block; font-size:17.267px;letter-spacing:-0.6px;line-height:20px;font-weight:550; margin-top: 6.0px; margin-left: 0.0px; font-variation-settings: "opsz" 14; }

/* ---------------- Menu (glass outline) ---------------- */
.menu {
  right: calc(1672px - 1540px - 79.5px);
  top: 47px;
  width: 79.5px; height: 53.5px;
  border: 1.5px solid var(--glass-line);
  background: rgba(255,255,255,0);
  -webkit-backdrop-filter: blur(0px); backdrop-filter: blur(0px);
  cursor: pointer; z-index: 4;
}
.menu i {
  position: absolute; left: 14.5px; width: 53.6px; height: 3.4px;
  background: var(--white);
}
.menu i:nth-child(1) { top: 18.3px; }
.menu i:nth-child(2) { top: 31.1px; }
.menu:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.9); }
.menu:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }

.sr-only { position:absolute!important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

/* ==================================================================
   PORTRAIT / NARROW LAYOUT (aspect < 1.2)
   Same artboard system, but the composition is re-flowed into a
   vertical poster: menu + clock on top, wordmark full-width, the figure
   rising from the bottom edge with its head over the wordmark, and the
   copy stacked on the figure's dark shoulders.
   All numbers come from JS as design px on a 430-wide artboard.
   ================================================================== */
.is-portrait .wordmark { left: var(--p-pad); top: var(--p-wm-y); width: var(--p-wm-w); height: var(--p-wm-h); }
.is-portrait .figure { top: var(--p-fig-y); height: var(--p-fig-h); width: calc(var(--p-fig-h) * 0.867); left: calc(var(--p-cx) - var(--p-fig-h) * 0.867 * 0.513); }
.is-portrait .menu { right: var(--p-pad); top: var(--p-top); transform: scale(.72); transform-origin: 100% 0; }
.is-portrait .clock { left: var(--p-pad); right: auto; top: calc(var(--p-top) + 1px); bottom: auto; width: auto; }
.is-portrait .clock__time { font-size: 19px; line-height: 21px; }
.is-portrait .clock__city { font-size: 12.5px; line-height: 14px; margin-top: 3px; letter-spacing: .02em; opacity: .9; }
.is-portrait .stack { position: absolute; left: var(--p-pad); right: var(--p-pad); max-width: 560px; bottom: var(--p-bot); display: flex; flex-direction: column; z-index: 3; }
.is-portrait .stack > * { position: static; left: auto; right: auto; top: auto; bottom: auto; }
.is-portrait .studio, .is-portrait .headline { transform: none; }
.is-portrait .studio { width: auto; height: auto; padding: 0; font-size: var(--p-st-fs); line-height: .96; letter-spacing: -.01em;
  background: linear-gradient(60deg, rgba(255,255,255,.3) 0%, #fff 38%); -webkit-background-clip: text; background-clip: text; }
.is-portrait .lede, .is-portrait .clock { transform: none; }
.is-portrait .lede { width: auto; margin-top: 14px; font-size: 14.5px; line-height: 22px; letter-spacing: 0; max-width: 34ch; }
.is-portrait .lede span { display: inline; white-space: normal; }
.is-portrait .headline { margin-top: var(--p-gap); font-size: var(--p-hl-fs); line-height: 1.02; letter-spacing: -.005em; white-space: normal; }
.is-portrait .headline span { display: inline; letter-spacing: inherit; margin-left: 0; }
.is-portrait .studio span { letter-spacing: inherit; margin-left: 0; }
.is-portrait .cta { position: relative; width: 100%; height: 56px; margin-top: 18px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); }
.is-portrait .cta__label { left: 22px; top: 50%; transform: translateY(-50%); line-height: 1; font-size: 16px; }
.is-portrait .cta__icon { left: auto; right: 22px; top: 50%; margin-top: -7px; }

/* Initial states exist only while the one-time entrance is running. */
.motion-ready .wordmark,
.motion-ready .studio,
.motion-ready .headline,
.motion-ready .cta { opacity: 0; clip-path: inset(0 100% 0 0); }
.motion-ready .figure { opacity: 0; transform: translate3d(0, 20px, 0); }
.motion-ready .lede,
.motion-ready .clock,
.motion-ready .menu { opacity: 0; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script>
(function () {
  var W = 1672, H = 941, BP = 1.2;
  var root = document.documentElement, hero = document.getElementById('hero');
  var stack = document.getElementById('stack');
  function layout() {
    var vw = hero.clientWidth, vh = hero.clientHeight;
    if (!vw || !vh) return;
    var portrait = vw / vh < BP;
    hero.classList.toggle('is-portrait', portrait);
    var s, sw, sh;
    if (!portrait) {
      s = Math.min(vw / W, vh / H);       /* fit the 16:9 composition ...      */
      sw = vw / s; sh = vh / s;           /* ... then grow the artboard to cover */
      root.style.setProperty('--ex', (sh - H).toFixed(3));
      root.style.setProperty('--exw', (sw - W).toFixed(3));
      /* keep the small copy legible (>= ~10.5px) on short landscape screens */
      root.style.setProperty('--tb', Math.min(1.6, Math.max(1, 10.5 / (18.062 * s))).toFixed(3));
    } else {
      var PW = 430;                       /* portrait artboard width (design px) */
      s = Math.min(vw / PW, vh / 640);
      sw = vw / s; sh = vh / s;
      var pad = Math.max(20, Math.min(32, sw * 0.055));
      var top = pad;
      var wmW = sw - pad * 2, wmH = wmW * 299.8 / 1395.1;
      var wmY = top + 66;
      /* head crown sits ~42% down the wordmark, exactly like the desktop frame */
      var crown = wmY + wmH * 0.32, crownR = 119 / 1536;
      var figH = Math.max(Math.min(sw * 1.92, sh * 1.5), (sh - crown) / (1 - crownR) + 6);
      var figY = crown - figH * crownR;
      var set = function (k, v) { root.style.setProperty(k, v); };
      set('--p-pad', pad + 'px'); set('--p-top', top + 'px');
      set('--p-wm-y', wmY + 'px'); set('--p-wm-w', wmW + 'px'); set('--p-wm-h', wmH + 'px');
      set('--p-fig-h', figH + 'px'); set('--p-fig-y', figY + 'px'); set('--p-cx', (sw / 2 + sw * 0.03) + 'px');
      set('--p-st-fs', Math.min(64, sw * 0.135) + 'px');
      set('--p-hl-fs', Math.min(34, sw * 0.074) + 'px');
      set('--p-gap', Math.max(22, Math.min(40, (sh - 640) * 0.15 + 22)) + 'px');
      set('--p-bot', Math.max(pad, sh * 0.035) + 'px');
    }
    root.style.setProperty('--s', s);
    root.style.setProperty('--sw', sw.toFixed(3));
    root.style.setProperty('--sh', sh.toFixed(3));
  }
  layout();
  if ('ResizeObserver' in window) new ResizeObserver(layout).observe(hero);
  window.addEventListener('resize', layout, { passive: true });
  window.addEventListener('orientationchange', layout);

  /* live Jakarta clock (keeps the reference "8:45 PM" format) */
  var el = document.getElementById('clock');
  if (!/[?&]static\b/.test(location.search) && window.Intl) {
    var fmt = new Intl.DateTimeFormat('en-US', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'Asia/Jakarta' });
    var tick = function () { el.textContent = fmt.format(new Date()); el.setAttribute('datetime', new Date().toISOString()); };
    tick();
  }

  /* One coordinated entrance; cancelling its animations restores the exact CSS layout. */
  if (root.classList.contains('motion-ready')) {
    var ease = 'cubic-bezier(.22, 1, .36, 1)';
    var animations = [];
    function enter(selector, frames, start, duration) {
      var node = document.querySelector(selector);
      animations.push(node.animate(frames, { delay: start, duration: duration, easing: ease, fill: 'both' }));
    }
    enter('.wordmark', [
      { opacity: 1, clipPath: 'inset(0 100% 0 0)' },
      { opacity: 1, clipPath: 'inset(0 0 0 0)' }
    ], 0, 760);
    enter('.figure', [
      { opacity: 0, transform: 'translate3d(0, 20px, 0)' },
      { opacity: 1, transform: 'none' }
    ], 280, 1040);
    enter('.clock', [{ opacity: 0 }, { opacity: 1 }], 420, 460);
    enter('.menu', [{ opacity: 0 }, { opacity: 1 }], 480, 460);
    enter('.studio', [
      { opacity: 1, clipPath: 'inset(0 0 100% 0)' },
      { opacity: 1, clipPath: 'inset(0 0 0 0)' }
    ], 790, 700);
    enter('.headline', [
      { opacity: 1, clipPath: 'inset(0 0 100% 0)' },
      { opacity: 1, clipPath: 'inset(0 0 0 0)' }
    ], 990, 730);
    enter('.lede', [{ opacity: 0 }, { opacity: 1 }], 1260, 500);
    enter('.cta', [
      { opacity: 1, clipPath: 'inset(0 100% 0 0)' },
      { opacity: 1, clipPath: 'inset(0 0 0 0)' }
    ], 1490, 540);
    Promise.all(animations.map(function (animation) { return animation.finished; }))
      .then(function () {
        root.classList.remove('motion-ready');
        animations.forEach(function (animation) { animation.cancel(); });
      });
  }
})();
</script>
</body>
</html>
