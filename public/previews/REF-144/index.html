<style>
/* ---------- Fonts (local assets) ---------- */
@font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:block;src:url(assets/inter.woff2) format("woff2")}
@font-face{font-family:"Arimo";font-style:normal;font-weight:700;font-display:block;src:url(assets/arimo-bold.woff2) format("woff2")}

/* ---------- Design tokens (sampled from reference) ---------- */
:root{
  --bg:#D0E3E6;          /* page background  rgb(208,227,230) */
  --paper:#FEFEFE;       /* mosaic blocks / white surfaces rgb(254,254,254) */
  --ink:#070B0C;         /* body + nav text  */
  --brand:#074342;       /* SUNDI wordmark   */
  --teal:#449896;        /* card + CTA tile  rgb(68,152,150) */
  --teal-ink:#3E9795;    /* arrow inside white circle */
  --rule:#A3C6C9;        /* nav dividers */
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-logo:"Arimo","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:geometricPrecision;font-kerning:normal;
  container-type:inline-size;   /* lets the stage size from the real content width (no scrollbar error) */
  overflow-x:hidden;
}
img,svg{display:block}
a{color:inherit;text-decoration:none}
ul{list-style:none;margin:0;padding:0}
p{margin:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* =====================================================================
   STAGE ARCHITECTURE (landscape / desktop)
   The artboard is 1449 × 1086 design units. 1 unit = --u CSS px.
   --u fits the artboard to the viewport, and every element is pinned to
   the edge it belongs to (top/middle/bottom × left/centre/right), so at the
   reference aspect ratio the layout is pixel-identical, and at any other
   ratio the extra room is absorbed by the background + mosaic — never by
   empty bands at the top or bottom.
   ===================================================================== */
.hero{
  --vw:100cqw;
  --u:min(var(--vw) / 1449, max(100dvh / 1086, .56px));
  position:relative;width:100%;
  height:max(100vh, calc(1086 * var(--u)));
  height:max(100dvh, calc(1086 * var(--u)));
  overflow:hidden;isolation:isolate;
}
@supports not (width:1cqw){.hero{--vw:100vw}}

.layer{position:absolute;width:calc(1449 * var(--u));height:calc(1086 * var(--u));pointer-events:none}
.layer>*{pointer-events:auto}
.L-tl{left:0;top:0}
.L-tc{left:calc(50% - 724.5 * var(--u));top:0}
.L-tr{right:0;top:0}
.L-ml{left:0;top:calc(50% - 543 * var(--u))}
.L-mc{left:calc(50% - 724.5 * var(--u));top:calc(50% - 543 * var(--u))}
.L-bl{left:0;bottom:0}

/* absolute placement helper: style="--x:..;--y:..;--w:..;--h:.." in design px */
.abs{position:absolute;left:calc(var(--x) * var(--u));top:calc(var(--y) * var(--u))}
.sized{width:calc(var(--w) * var(--u));height:calc(var(--h) * var(--u))}
.t{position:absolute;white-space:nowrap;line-height:1;font-size:calc(var(--fs) * var(--u));
   left:calc(var(--x) * var(--u));top:calc(var(--y) * var(--u));letter-spacing:calc(var(--ls,0) * var(--u))}

/* ---------- Mosaic (pixel-step backdrop) ---------- */
.mosaic{position:absolute;z-index:-1;bottom:0;
  width:calc(4347 * var(--u));height:calc(526 * var(--u));
  left:calc(50% - (724.5 + 1449) * var(--u))}
.mosaic rect{fill:var(--paper)}

/* ---------- Nav ---------- */
.nav li{position:absolute;left:calc(42.5 * var(--u));width:calc(272.5 * var(--u))}
.nav a{display:block;position:relative;height:100%}
.nav .rule{position:absolute;left:0;right:0;bottom:0;height:calc(1.5 * var(--u));background:var(--rule)}
.nav .lbl{font-size:calc(var(--fs) * var(--u));line-height:1;position:absolute;left:calc(var(--lx) * var(--u));top:calc(var(--ly) * var(--u));white-space:nowrap;letter-spacing:calc(var(--ls,0) * var(--u))}
.nav .go{position:absolute;opacity:0;transition:opacity .25s,transform .25s}
.nav li.is-active .go{opacity:1}
.nav a:hover .go,.nav a:focus-visible .go{opacity:1;transform:translate(calc(2*var(--u)),calc(-2*var(--u)))}
.nav a:hover .lbl{transform:translateX(calc(3*var(--u)))}
.nav .lbl{transition:transform .25s}

/* ---------- Brand ---------- */
.logo{font-family:var(--font-logo);font-weight:700;color:var(--brand)}
.logo .reg{position:absolute;overflow:visible}

/* ---------- CTA ---------- */
.shop{display:block}
.shop .pill{position:absolute;background:var(--paper);border-radius:calc(var(--r) * var(--u))}
.shop .tile{position:absolute;background:var(--teal);border-radius:calc(var(--r) * var(--u));transition:filter .2s}
.shop:hover .tile{filter:brightness(1.08)}
.shop .tile svg{transition:transform .25s}
.shop:hover .tile svg{transform:translate(calc(2*var(--u)),calc(-2*var(--u)))}

/* ---------- Hero image ---------- */
.hp{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none}

/* ---------- Product card ---------- */
.card{position:absolute;background:var(--teal);color:#fff}
.card .thumb{position:absolute;background:var(--paper);overflow:hidden}
.card .thumb img{position:absolute;max-width:none}
.card .desc{white-space:normal;color:rgba(255,255,255,var(--da,.92))}
.card .go{position:absolute;border-radius:50%;background:var(--paper);transition:transform .25s}
.card .go:hover{transform:rotate(45deg)}

:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.menu-btn{display:none}

/* =====================================================================
   PORTRAIT / NARROW LAYOUT
   Same components, reflowed into a column that always fills the screen.
   1 unit = --m CSS px (390-wide phone baseline).
   ===================================================================== */
@media (max-aspect-ratio: 11/10), (max-height: 540px) and (max-width: 1000px){
  .hero{
    --m:clamp(.82px, min(var(--vw) / 390, 100dvh / 600), 1.45px);
    /* re-express the desktop unit so shared components scale with --m */
    --u:calc(var(--m) * .98);
    height:auto;min-height:100vh;min-height:100dvh;
    display:grid;
    grid-template-columns:calc(20 * var(--m)) auto 1fr auto calc(20 * var(--m));
    grid-template-rows:auto minmax(calc(250 * var(--m)), 1fr) auto auto;
    grid-template-areas:
      ". menu logo cart ."
      ". hp   hp   hp   ."
      ". lede lede lede ."
      ". card card card .";
    row-gap:calc(18 * var(--m));
    padding:calc(18 * var(--m)) 0 calc(22 * var(--m));
    padding-top:max(calc(18 * var(--m)), env(safe-area-inset-top));
    padding-bottom:max(calc(22 * var(--m)), env(safe-area-inset-bottom));
  }
  .layer{display:contents}
  .logo,.cart,.lede{position:relative!important;left:auto!important;top:auto!important}
  .mosaic{--k:calc(var(--m) * .5);width:calc(4347 * var(--k));height:calc(526 * var(--k));
          left:calc(50% - (1449 + 360) * var(--k));bottom:calc(-12 * var(--m))}

  .menu-btn{grid-area:menu;display:flex;align-items:center;gap:calc(8*var(--m));align-self:center;
    background:none;border:0;padding:calc(6*var(--m)) 0;font:inherit;color:var(--ink);cursor:pointer;
    font-size:calc(15*var(--m))}
  .menu-btn i{display:block;width:calc(22*var(--m));height:calc(10*var(--m));position:relative}
  .menu-btn i::before,.menu-btn i::after{content:"";position:absolute;left:0;right:0;height:calc(1.6*var(--m));background:currentColor;transition:transform .25s}
  .menu-btn i::before{top:0}.menu-btn i::after{bottom:0}
  .hero.nav-open .menu-btn i::before{transform:translateY(calc(4.2*var(--m))) rotate(45deg)}
  .hero.nav-open .menu-btn i::after{transform:translateY(calc(-4.2*var(--m))) rotate(-45deg)}

  .logo{grid-area:logo;justify-self:center;align-self:center;position:relative;font-size:calc(30*var(--m))!important;line-height:1}
  .cart{grid-area:cart;align-self:center;font-size:calc(15*var(--m))!important}

  .nav{position:absolute;z-index:5;left:0;right:0;top:calc(64*var(--m));padding:calc(4*var(--m)) calc(20*var(--m)) calc(20*var(--m));
       background:var(--bg);box-shadow:0 calc(16*var(--m)) calc(24*var(--m)) calc(-18*var(--m)) rgba(7,67,66,.25);
       opacity:0;visibility:hidden;transform:translateY(calc(-8*var(--m)));transition:opacity .25s,transform .25s,visibility .25s}
  .hero.nav-open .nav{opacity:1;visibility:visible;transform:none}
  .nav ul{display:block}
  .nav li{position:relative;left:auto!important;top:auto!important;width:auto;height:calc(64*var(--m))!important}
  .nav .lbl{left:calc(14*var(--m))!important;top:calc(21*var(--m))!important;font-size:calc(20*var(--m))!important}
  .nav .go{left:auto!important;right:calc(14*var(--m));top:calc(24*var(--m))!important;width:calc(14*var(--m))!important;height:calc(14*var(--m))!important}
  .nav .rule{height:1.5px}

  .hp-wrap{grid-area:hp;position:relative!important;left:auto!important;top:auto!important;width:auto!important;height:auto!important;min-height:0}
  .hp{inset:0;width:100%!important;height:100%!important;object-fit:contain;left:0!important;top:0!important}
  .shop{position:absolute;left:auto!important;top:auto!important;right:0;bottom:4%;width:calc(252*var(--u));height:calc(64*var(--u))}
  .shop .pill{left:0!important;top:calc(2*var(--u))!important}
  .shop .tile{left:calc(186.5*var(--u))!important;top:0!important}
  .shop .t{position:absolute;left:calc(24.7*var(--u))!important;top:calc(20*var(--u))!important}

  .lede{grid-area:lede;white-space:normal!important;max-width:calc(350*var(--m));font-size:calc(17*var(--m))!important;line-height:1.62!important}
  .lede br{display:none}

  .card{grid-area:card;position:relative!important;left:auto!important;top:auto!important;justify-self:start}
}
/* One opening sequence. The original composition is restored when the last beat ends. */
html.has-entrance .logo{animation:sundi-brand-in .72s cubic-bezier(.22,1,.36,1) .05s both}
html.has-entrance .nav li{animation:sundi-quiet-in .5s cubic-bezier(.22,1,.36,1) both}
html.has-entrance .nav li:nth-child(1){animation-delay:.18s}
html.has-entrance .nav li:nth-child(2){animation-delay:.25s}
html.has-entrance .nav li:nth-child(3){animation-delay:.32s}
html.has-entrance .nav li:nth-child(4){animation-delay:.39s}
html.has-entrance .cart,html.has-entrance .menu-btn{animation:sundi-quiet-in .5s cubic-bezier(.22,1,.36,1) .24s both}
html.has-entrance .hp{animation:sundi-product-in 1.06s cubic-bezier(.16,1,.3,1) .27s both}
html.has-entrance .lede{animation:sundi-copy-in .8s cubic-bezier(.22,1,.36,1) .53s both}
html.has-entrance .shop{animation:sundi-quiet-in .52s cubic-bezier(.22,1,.36,1) 1.02s both}
html.has-entrance .card{animation:sundi-card-in .66s cubic-bezier(.22,1,.36,1) 1.15s both}
@keyframes sundi-brand-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sundi-quiet-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes sundi-product-in{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
@keyframes sundi-copy-in{from{opacity:0;clip-path:inset(0 0 100% 0);transform:translateY(9px)}to{opacity:1;clip-path:inset(0);transform:none}}
@keyframes sundi-card-in{from{opacity:0;clip-path:inset(0 7% 0 0);transform:translateY(8px)}to{opacity:1;clip-path:inset(0);transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}html.has-entrance .logo,html.has-entrance .nav li,html.has-entrance .cart,html.has-entrance .menu-btn,html.has-entrance .hp,html.has-entrance .lede,html.has-entrance .shop,html.has-entrance .card{animation:none!important}}
</style>
