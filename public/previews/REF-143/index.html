    if(c.id==='hero') s=Math.min(s,0.94*vw/c.w,0.6*vh/c.h);
    const w=c.w*s,h=c.h*s,cw=c.w*k,ch=c.h*k;
    // keep each block's relative position inside the free space on each axis
    const fx=C.W-cw>0?x/(C.W-cw):.5, fy=C.H-ch>0?y/(C.H-ch):.5;
    let left=c.id==='hero'?(port?(vw-w)/2:fx*(vw-w)):fx*(vw-w), top=fy*(vh-h);
    if(c.id==='tag'&&!port&&pos['g-perf']){const q=pos['g-perf'];s=q.s;left=q.l+(c.x-q.x)*s;top=q.t+(c.y-q.y)*s;}  // caption stays locked to its card
    pos[c.id]={l:left,t:top,s,x:c.x,y:c.y};
    el.style.transform=`translate(${left}px,${top}px) scale(${s})`;
  }
}
function layoutMobile(vw,vh,mode){
  const C=mode==='mp'?{W:400,H:860}:{W:820,H:380}, sx=vw/C.W, sy=vh/C.H;
  const S=Math.min(Math.sqrt(sx*sy),Math.min(sx,sy)*1.04);                          // same balanced scale as the other modes
  const m=Math.min(24,Math.max(12,vw*0.035));
  const pos=POS;for(const k in pos)delete pos[k];
  for(const [c,el] of els){
    el.style.display='';
    let s,left,top;
    if(c.id==='logo'){ s=Math.min(34,Math.max(26,Math.min(vw*0.075,vh*0.05)))/47; left=m-9*s; top=m*0.8-5*s; }
    else if(c.id==='nav'){ const lg=pos.logo;s=34/30;left=vw-m-239*s;top=(lg.t+(5+47*0.5)*lg.s)-17*s; }
    else if(c.id==='tag'){ const q=pos['g-perf'];s=Math.max(q.s,12.5/15);
      if(mode==='ml'){ left=q.l+215*q.s+10; top=q.t+112*q.s-22*s; }                         // landscape: caption beside its card
      else{ left=q.l+(c.x-q.x)*q.s; top=q.t+(c.y-q.y)*q.s; }                                 // portrait: caption under its card
      left=Math.max(m,Math.min(left,vw-m-280*s));top=Math.min(top,vh-m*0.6-30*s); }
    else{
      const [x,y,k]=c[mode];
      s=S*k;
      if(c.id==='hero'){ s=Math.min(s,(vw-2*m)/581,(mode==='ml'?0.78:0.4)*vh/c.h);
        el.style.setProperty('--cta-k',Math.max(1.3,12/(15*s)).toFixed(3)); }
      const w=c.w*s,h=c.h*s,cw=c.w*k,ch=c.h*k;
      const fx=C.W-cw>0?x/(C.W-cw):.5, fy=C.H-ch>0?y/(C.H-ch):.5;
      left=(c.id==='hero'&&mode==='mp')?(vw-590*s)/2+4*s:fx*(vw-w); top=fy*(vh-h);
      if(c.id!=='hero'){left=Math.min(Math.max(left,0),vw-w);top=Math.min(Math.max(top,0),vh-h);}
    }
    pos[c.id]={l:left,t:top,s,x:c.x,y:c.y};
    el.style.transform=`translate(${left}px,${top}px) scale(${s})`;
  }
}
function layoutTablet(vw,vh,mode,dS){
  const C=mode==='tp'?TP:L, sx=vw/C.W, sy=vh/C.H;
  const S=Math.min(Math.sqrt(sx*sy),Math.min(sx,sy)*1.04);
  const m=Math.min(40,Math.max(20,vw*0.034));              // outer margin: tighter than desktop, never edge-hugging
  const textK=mode==='tl'?Math.min(1.12,Math.pow(BP/dS,1.6)):1; // landscape: grow type from the breakpoint so it never jumps
  const pos=POS;for(const k in pos)delete pos[k];
  for(const [c,el] of els){
    el.style.display='';
    let s,left,top;
    if(c.id==='logo'&&mode==='tl'){
      s=S;left=c.x/(C.W-c.w)*(vw-c.w*s);top=c.y/(C.H-c.h)*(vh-c.h*s);   // landscape keeps the desktop wordmark placement
    }else if(c.id==='logo'){
      s=Math.min(44,Math.max(34,vw*0.036))/47;left=m-9*s;top=m*0.8-5*s;
    }else if(c.id==='nav'){
      const lg=pos.logo;s=36/30;                                 // 36px circle + 7px invisible halo = 50px touch target
      left=vw-m-239*s;top=(lg.t+(5+47*0.5)*lg.s)-17*s;
    }else if(c.id==='tag'){
      const q=pos['g-perf'];s=Math.max(q.s,13.5/15);left=q.l+(c.x-q.x)*q.s;top=q.t+(c.y-q.y)*q.s;
    }else{
      let x=c.x,y=c.y,k=1;
      if(mode==='tp'&&c.tp)[x,y,k]=c.tp;
      if(mode==='tl'&&c.tl)[x,y]=c.tl;
      if(c.id==='hero'){
        s=mode==='tp'?Math.min(S*k,0.88*vw/c.w,0.5*vh/c.h):Math.min(S*textK,0.62*vh/c.h,0.6*vw/c.w);
      }else s=S*k;
      const w=c.w*s,h=c.h*s,cw=c.w*k,ch=c.h*k;
      const fx=C.W-cw>0?x/(C.W-cw):.5, fy=C.H-ch>0?y/(C.H-ch):.5;
      left=(c.id==='hero'&&mode==='tp')?(vw-w)/2:fx*(vw-w);top=fy*(vh-h);
      // tablet: keep every card fully inside the viewport margins-free edge (no bleed, no overflow)
      if(c.id!=='hero'){left=Math.min(Math.max(left,0),vw-w);top=Math.min(Math.max(top,0),vh-h);}
    }
    pos[c.id]={l:left,t:top,s,x:c.x,y:c.y};
    el.style.transform=`translate(${left}px,${top}px) scale(${s})`;
  }
}
/* ---- cursor field (measured from the reference recording) ----
   parallax: every card shifts by -0.252 x (cursor - rest point)
   magnify : scale = 1 + 1.05*exp(-(d/sigma)^2), sigma = 421 design px (510px at 1920w)
   easing  : exponential follow, tau = 100ms (settles in ~0.4s) */
const K=0.252,AMP=1.05,SIG=421,TAU=0.1;
const cards=[...document.querySelectorAll('.card')].map(el=>({el,g:el.dataset.g,cx:+el.dataset.cx,cy:+el.dataset.cy,b:1}));
const groups=[...new Set(cards.map(c=>c.g))].map(id=>[id,document.getElementById(id)]);
const dotEl=document.getElementById('cursor');
const still=matchMedia('(prefers-reduced-motion: reduce)');
let rest={x:0,y:0},dot=null,target=null,last=0,raf=0,dotR=5;
const prox=(d,s)=>1+AMP*Math.exp(-((d/(SIG*s))**2));
function calibrate(){
  const h=POS.hero;rest={x:h.l+(929-520)*h.s,y:h.t+(327-285)*h.s};   // cursor position captured in the reference
  dotR=5*h.s; dotEl.style.width=dotEl.style.height=(2*dotR)+'px';
  for(const c of cards){const q=POS[c.g];if(!q){c.b=1;continue}
    c.b=1/prox(Math.hypot(q.l+c.cx*q.s-rest.x,q.t+c.cy*q.s-rest.y),q.s);}   // at rest the page equals the reference
  if(!dot||!target)dot={...rest};   // after any re-layout with no active pointer, the field sits exactly at rest
}
function render(){
  const dx=-K*(dot.x-rest.x),dy=-K*(dot.y-rest.y),zmax={};
  for(const c of cards){const q=POS[c.g];if(!q)continue;
    const X=q.l+c.cx*q.s+dx,Y=q.t+c.cy*q.s+dy;
    const sc=c.b*prox(Math.hypot(X-dot.x,Y-dot.y),q.s);
    c.el.style.transform=`translate(${dx/q.s}px,${dy/q.s}px) scale(${sc})`;
    zmax[c.g]=Math.max(zmax[c.g]||0,sc*c.b>0?sc/c.b:0);}
  for(const [id,el] of groups) el.style.zIndex=1+Math.round((zmax[id]||1)*100);   // the most magnified group comes forward
  dotEl.style.transform=`translate(${dot.x-dotR}px,${dot.y-dotR}px)`;
}
function tick(t){
  const dt=Math.min((t-(last||t))/1000,.05);last=t;
  const goal=(still.matches||!target)?rest:target, a=1-Math.exp(-dt/TAU);
  dot.x+=(goal.x-dot.x)*a;dot.y+=(goal.y-dot.y)*a;render();
  if(Math.hypot(goal.x-dot.x,goal.y-dot.y)>.05)raf=requestAnimationFrame(tick);else{raf=0;last=0;}
}
const kick=()=>{if(!raf)raf=requestAnimationFrame(tick)};
addEventListener('pointermove',e=>{target={x:e.clientX+scrollX,y:e.clientY+scrollY};kick();},{passive:true});
addEventListener('pointercancel',()=>{target=null;kick();});
addEventListener('pointerup',e=>{if(e.pointerType==='touch'){target=null;kick();}});
document.documentElement.addEventListener('mouseleave',()=>{target=null;kick();});
function relayout(){layout();calibrate();render();}
addEventListener('resize',relayout);relayout();
document.fonts&&document.fonts.ready.then(relayout);
})();
</script>
<script>
/* ============ ENTRANCE — plays once on load, then every animation is removed; final frame = authored layout ============
   Motion language
   A  masked rise    — typography rises inside a fixed mask (translate + matching clip-path, same easing ⇒ mask stays still)
   B  clip-rise      — cards open upward from their base while settling a few px; ripple outward from the headline, lower layers first
   C  iris / settle  — circular UI: CTA ring opens from its centre; menu circle and cursor dot scale in
   D  fade           — the frosted nav panel
   The orange stage (background + grain) never moves. */
(()=>{
  const root=document.documentElement;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){root.classList.remove('intro');return;}
  const EXPO='cubic-bezier(.16,1,.3,1)', QUART='cubic-bezier(.25,1,.5,1)';
  const anims=[];
  const play=(el,kf,o)=>{if(el)anims.push(el.animate(kf,{fill:'backwards',easing:EXPO,...o}))};
  // A — masked rise: element travels up by T% of its own height while the clip's bottom edge travels with it
  const rise=(el,delay,dur,T=115,pad=15,side=20)=>play(el,[
      {translate:`0 ${T}%`,clipPath:`inset(-${pad}% -${side}% ${T-pad}% -${side}%)`},
      {translate:'0 0',clipPath:`inset(-${pad}% -${side}% -${pad}% -${side}%)`}],{delay:delay*1000,duration:dur*1000});
  function start(){
    const lines=[[0,1],[2,3,4],[5,6],[7]], words=[...document.querySelectorAll('.w')];
    // 0.05  identity: logo rises; nav follows, understated
    rise(document.querySelector('.logo'),.05,.95);
    play(document.querySelector('.nav>.glass'),[{opacity:0},{opacity:1}],{delay:120,duration:700,easing:QUART});
    document.querySelectorAll('.nl').forEach((el,i)=>rise(el,.14+i*.06,.75,110,20,10));
    play(document.querySelector('.menu'),[{scale:'.55',opacity:0},{scale:'1',opacity:1}],{delay:260,duration:750});
    // 0.16  headline — line by line, words lightly staggered inside each line
    lines.forEach((ln,li)=>ln.forEach((wi,k)=>rise(words[wi],.16+li*.09+k*.035,1.05)));
    // 0.45  collage assembles outward from the headline
    const hb=words.reduce((b,w)=>{const r=w.getBoundingClientRect();return{l:Math.min(b.l,r.left),t:Math.min(b.t,r.top),r:Math.max(b.r,r.right),b:Math.max(b.b,r.bottom)}},{l:1e9,t:1e9,r:-1e9,b:-1e9});
    const hx=(hb.l+hb.r)/2, hy=(hb.t+hb.b)/2;
    const cards=[...document.querySelectorAll('.card')].filter(c=>c.getClientRects().length);
    const d=cards.map(c=>{const r=c.getBoundingClientRect();return Math.hypot(r.left+r.width/2-hx,r.top+r.height/2-hy)}), dmax=Math.max(...d)||1;
    cards.forEach((c,i)=>{
      const layer=[...c.parentNode.children].indexOf(c);
      play(c,[{clipPath:'inset(100% 0 0 0)',translate:'0 22px'},{clipPath:'inset(0% 0 0 0)',translate:'0 0'}],
        {delay:(.45+.6*(d[i]/dmax)+layer*.045)*1000,duration:900});
    });
    // 0.95  the invitation: ring irises open, label rises, arrow settles along its own diagonal
    play(document.querySelector('.cta'),[{clipPath:'circle(0% at 50% 50%)'},{clipPath:'circle(75% at 50% 50%)'}],{delay:950,duration:900});
    rise(document.querySelector('.cta .t1'),1.05,.75,115,20,10);
    rise(document.querySelector('.cta .t2'),1.11,.75,115,20,10);
    play(document.querySelector('.cta .arr'),[{translate:'-6px -6px',opacity:0},{translate:'0 0',opacity:1}],{delay:1250,duration:650,easing:QUART});
    // 1.35  closing details
    rise(document.querySelector('.tagline'),1.35,.8,115,25,5);
    play(document.getElementById('cursor'),[{scale:'0',opacity:0},{scale:'1',opacity:1}],{delay:1550,duration:550});
    root.classList.remove('intro');                        // backwards-fill now holds every start state — no flash
    // STOP: once everything has finished, drop every animation object so nothing remains attached
    Promise.all(anims.map(a=>a.finished)).then(()=>{
      const els=[...new Set(anims.map(a=>a.effect.target))];
      anims.forEach(a=>a.cancel());
      // re-rasterise once, in the same task (no intermediate paint), so text leaves its animation layer pixel-identical
      const prev=els.map(e=>e.style.display);els.forEach(e=>e.style.display='none');void root.offsetHeight;els.forEach((e,i)=>e.style.display=prev[i]);
    }).catch(()=>{});
  }
  // begin once fonts and card images are ready (capped, so the page is never held back)
  const ready=Promise.all([document.fonts?document.fonts.ready:0,...[...document.images].map(i=>i.decode().catch(()=>{}))]);
  let started=false;const go=()=>{if(!started){started=true;requestAnimationFrame(start);}};
  ready.then(go);setTimeout(go,700);
})();
</script></body></html>
