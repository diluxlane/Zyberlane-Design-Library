<!doctype html>
<html lang="en">

<title>ELSE — Official Site</title>
<meta name="theme-color" content="#000000">
<script>if(!window.matchMedia || !matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('entrance');</script>
<style>
@font-face{font-family:"Archivo X";src:url(assets/archivo-x.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:block}

/* ==========================================================================
   SCALE SYSTEM
   Reference artboard 2048 × 1151 (16:9).
   --u  layout unit: positions / distances from the viewport edges.
   --t  component unit: sizes of type, pills, cards, icons. Equals --u
        everywhere the desktop design is legible (u ≥ 0.6); below that the
        components hold their size while the layout keeps flowing.
   --h  hero unit: musician + giant lettering.
   At 16:9 all three equal viewport/artboard → reference pixel match.

   Architecture tiers (content-driven, see notes at each query):
     Desktop ........ landscape, nav fits             (base rules)
     Compact land ... landscape, nav collides < 50em  (links → menu)
     Tablet portrait  portrait, > 33.75em             (recomposed hero)
     Mobile ......... portrait, ≤ 33.75em             (mobile architecture)
   ========================================================================== */
:root{
  --vw:1vw; --vh:1vh;
  --bg-img:url(assets/background.jpg);
  --ink:#fff; --muted:#b0b0b0; --arc:#aaaaaa;
  --font:"Archivo X","Archivo",system-ui,sans-serif;
  --glass-dark:rgba(28,28,28,.72);
  --ease:cubic-bezier(.2,.7,.2,1);
}
@supports (height:1dvh){:root{--vh:1dvh}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font);font-stretch:100%;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid rgba(255,255,255,.85);outline-offset:3px}

/* The stage is a single-viewport composition: imagery is intentionally
   cropped at the frame edges (cover background, arms reaching off-screen). */
.stage{
  position:fixed;inset:0;overflow:hidden;background:#000;isolation:isolate;
  --u:min(calc(var(--vw)*100/1600), calc(var(--vh)*100/1151));
  --t:max(var(--u), .6px);
  --h:min(calc(var(--vh)*100/1151), calc(var(--vw)*100/1700));
  --lh:var(--h);
  --hx:calc(var(--vw)*50 - 1024*var(--h));
  --hy:calc(var(--vh)*100 - 1151*var(--h));
}

/* ---------- background ---------- */
.bg,.letters,.letters i{position:absolute;inset:0}
.bg{background:var(--bg-img) center/cover no-repeat}
.bg::after{content:"";position:absolute;inset:0;background:
  radial-gradient(38% 55% at 97% 0%,rgba(255,255,255,.075),rgba(255,255,255,0) 100%),
  radial-gradient(22% 22% at 14% 14%,rgba(0,0,0,.16),rgba(0,0,0,0) 100%),
  rgba(0,0,0,.18)}

/* giant ELSE: a brightened copy of the same smoke, clipped to the glyphs */
.letters{
  -webkit-mask:var(--letters) no-repeat; mask:var(--letters) no-repeat;
  --lx:calc(var(--vw)*50 - 544*var(--lh));
  --ly:calc(var(--hy) + 870*var(--h) - 600*var(--lh));
  -webkit-mask-size:calc(1076*var(--lh)) calc(600*var(--lh)); mask-size:calc(1076*var(--lh)) calc(600*var(--lh));
  -webkit-mask-position:var(--lx) var(--ly); mask-position:var(--lx) var(--ly);
}
.letters i{background:var(--bg-img) center/cover no-repeat;filter:brightness(2.05)}
.letters i+i{filter:none;background:
   url("assets/texture.svg"),
   linear-gradient(180deg,rgba(255,255,255,.05) 22%,rgba(255,255,255,0) 50%,rgba(0,0,0,.06) 70%),
   linear-gradient(100deg,rgba(255,255,255,.02) 25%,rgba(255,255,255,.13) 72%)}

.musician{
  position:absolute;left:calc(var(--hx) + 180*var(--h));top:calc(var(--hy) + 199*var(--h));
  width:calc(1692*var(--h));height:calc(952*var(--h));display:block;pointer-events:none;user-select:none;
}

/* ---------- header ---------- */
.logo{position:absolute;z-index:30;left:calc(83.34*var(--u));top:calc(49.22*var(--u));width:calc(91.70*var(--t));height:calc(53.57*var(--t));display:block}
.logo img{width:100%;height:100%;display:block}

.nav{position:absolute;top:calc(48*var(--u));left:calc(var(--vw)*50 - 3*var(--u));transform:translateX(-50%);height:calc(60*var(--t));
  display:flex;align-items:center;gap:calc(85*var(--t));list-style:none}
.nav a,.follow,.btn{font-size:calc(21.6*var(--t));font-weight:540;line-height:1;letter-spacing:0;text-transform:uppercase;white-space:nowrap}
.nav a{display:block;transition:opacity .2s}

.follow{position:absolute;right:calc(95*var(--u));top:calc(46*var(--u));width:calc(190*var(--t));height:calc(60*var(--t));
  border-radius:calc(30*var(--t));display:grid;place-items:center;padding-top:calc(2*var(--t));color:#000;
  background:radial-gradient(72% 135% at 46% 40%,rgba(255,255,255,.99) 0%,rgba(250,253,255,.9) 42%,rgba(236,246,252,.42) 100%);
  box-shadow:inset 0 0 0 calc(1.5*var(--t)) rgba(255,255,255,.9),0 calc(6*var(--t)) calc(24*var(--t)) rgba(0,0,0,.18);
  -webkit-backdrop-filter:blur(calc(14*var(--t)));backdrop-filter:blur(calc(14*var(--t)));transition:transform .2s}

.menu-btn{display:none}

/* ---------- socials ---------- */
.social{--sg:calc(60*var(--t));position:absolute;right:calc(94*var(--u));display:flex;flex-direction:column;gap:var(--sg);list-style:none;
  /* hero-anchored (artboard y 441.5); on short screens bounded between the header and the release label */
  top:clamp(calc(46*var(--u) + 72*var(--t)), calc(var(--hy) + 441.5*var(--h)), calc(var(--vh)*100 - 99*var(--u) - 259*var(--t) - 90*var(--t) - 2*var(--sg)))}
.social a{position:relative;display:grid;place-items:center;width:calc(30*var(--t));height:calc(30*var(--t))}
.social svg{display:block;width:100%;height:100%}

/* ---------- glass cards ---------- */
.card{position:absolute;bottom:calc(99*var(--u));width:calc(390*var(--t));height:calc(179*var(--t));
  border-radius:calc(26*var(--t));text-align:center;
  background:var(--glass-dark);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),0 calc(20*var(--t)) calc(50*var(--t)) rgba(0,0,0,.35);
  -webkit-backdrop-filter:blur(calc(22*var(--t)));backdrop-filter:blur(calc(22*var(--t)))}
.card.tour{left:calc(86*var(--u))}
.card.release{right:calc(93*var(--u))}
.card h2{position:absolute;left:0;right:0;top:calc(19.5*var(--t));font-size:calc(29.6*var(--t));font-weight:500;line-height:1.2;letter-spacing:0}
.card p{position:absolute;left:0;right:0;top:calc(57.5*var(--t));font-size:calc(22.4*var(--t));font-weight:400;line-height:1.2;color:var(--muted)}
.btn{position:absolute;left:calc(19*var(--t));right:calc(19*var(--t));top:calc(100*var(--t));height:calc(60*var(--t));
  border-radius:calc(30*var(--t));display:grid;place-items:center;color:#fff;
  background:linear-gradient(90deg,rgba(255,255,255,.02) 0%,rgba(255,255,255,.123) 50%,rgba(255,255,255,.02) 100%);
  box-shadow:inset 0 calc(2*var(--t)) calc(1*var(--t)) calc(-.5*var(--t)) rgba(255,255,255,.17),inset 0 calc(-1.5*var(--t)) 0 rgba(255,255,255,.1),inset 0 0 0 calc(1.2*var(--t)) rgba(255,255,255,.05);
  padding-top:calc(1*var(--t));
  transition:background-color .2s}

/* curved labels: SVG coordinates are artboard px, so one unit (--as) scales the whole arc */
.arc{--as:var(--t);position:absolute;top:calc(-100*var(--as));left:calc(54.5*var(--as));width:calc(260*var(--as));height:calc(120*var(--as));overflow:visible;pointer-events:none}
.release .arc{left:calc(57.5*var(--as))}
.arc text{paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2px;font-family:var(--font);font-stretch:112%;font-size:15.5px;font-weight:500;letter-spacing:2px;fill:var(--arc);white-space:pre}


/* hover polish only where hover exists */
@media (hover:hover){
  .nav a:hover{opacity:.7}
  .follow:hover{transform:translateY(-1px)}
  .btn:hover{background-color:rgba(255,255,255,.06)}
}
/* touch: grow hit areas invisibly (≥ 44px) without changing the drawn components */
@media (pointer:coarse){
  .social a::after,.btn::after,.follow::after,.menu-btn::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
  .btn,.follow{position:absolute}
}

/* ==========================================================================
   COLLAPSED NAVIGATION — shared by every tier where the centre links no
   longer fit beside the logo + Follow pill. The <nav> itself becomes the
   overlay (same DOM as desktop; no duplicated links).
   Landscape limit 50em: with components at their minimum size the link row
   (678t wide) meets the Follow pill at ≈ 800px.
   ========================================================================== */
@media (orientation:landscape) and (max-width:50em), (orientation:portrait){
  .menu-btn{display:grid;place-items:center;position:absolute;z-index:40;border-radius:50%;
    background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,var(--ring,.2));
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .menu-btn span,.menu-btn span::before,.menu-btn span::after{display:block;width:var(--bar);height:2px;background:#fff;border-radius:2px;position:relative;transition:transform .25s,background .25s}
  .menu-btn span::before,.menu-btn span::after{content:"";position:absolute;left:0}
  .menu-btn span::before{top:calc(-1*var(--bo))}
  .menu-btn span::after{top:var(--bo)}
  .stage.open .menu-btn span{background:transparent}
  .stage.open .menu-btn span::before{transform:translateY(var(--bo)) rotate(45deg)}
  .stage.open .menu-btn span::after{transform:translateY(calc(-1*var(--bo))) rotate(-45deg)}

  .primary{position:absolute;inset:0;z-index:20;visibility:hidden;transition:visibility 0s .35s;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(28px,5vh,44px)}
  .primary::before{content:"";position:absolute;inset:0;background:rgba(8,8,8,.62);
    -webkit-backdrop-filter:blur(22px) saturate(.9);backdrop-filter:blur(22px) saturate(.9);opacity:0;transition:opacity .35s var(--ease)}
  .primary .nav{position:relative;left:auto;top:auto;transform:none;height:auto;flex-direction:column;gap:clamp(14px,3.2vh,26px)}
  .primary .nav li{opacity:0;transform:translateY(10px);transition:opacity .35s var(--ease),transform .35s var(--ease)}
  .primary .nav a{font-size:clamp(26px,min(7vw,6.2vh),44px);letter-spacing:.02em;padding:4px 12px}
  .primary .follow{visibility:visible}             /* the pill stays in the header */
  .stage.open .primary{visibility:visible;transition:visibility 0s}
  .stage.open .primary::before{opacity:1}
  .stage.open .primary .nav li{opacity:1;transform:none}
  .stage.open .primary .nav li:nth-child(2){transition-delay:.03s}
  .stage.open .primary .nav li:nth-child(3){transition-delay:.06s}
  .stage.open .primary .nav li:nth-child(4){transition-delay:.09s}
  .stage.open .primary .nav li:nth-child(5){transition-delay:.12s}
}

/* ---------- compact landscape (phones sideways, very small windows) ---------- */
@media (orientation:landscape) and (max-width:50em){
  .logo{left:max(calc(83.34*var(--u)), env(safe-area-inset-left))}
  .card.tour{left:max(calc(86*var(--u)), env(safe-area-inset-left))}
  .card.release,.social{right:max(calc(93*var(--u)), env(safe-area-inset-right))}
  .follow{right:max(calc(95*var(--u)), env(safe-area-inset-right))}
  .menu-btn{top:calc(46*var(--u));right:calc(max(calc(95*var(--u)), env(safe-area-inset-right)) + 210*var(--t));width:calc(60*var(--t));height:calc(60*var(--t));--bar:calc(24*var(--t));--bo:calc(7*var(--t));--ring:.18}
  .social{--sg:calc(20*var(--t))}                 /* tighter column fits the short header→label band */
}

/* ==========================================================================
   TABLET PORTRAIT — recomposed hero: header (logo · Follow · menu), socials
   under the header, lettering + musician centred, cards docked side by side.
   Holds while 2 cards at 376u stay legible (title 27u ≥ 17px → ≥ 33.75em).
   ========================================================================== */
@media (orientation:portrait){
  .stage{
    --u:min(calc(var(--vw)*100/860), calc(var(--vh)*100/1300));
    --t:var(--u);
    --h:min(calc(var(--vw)*100/800), calc(var(--vh)*100/1650));
    --lh:min(var(--h), calc(var(--vw)*92/1076));
    --hx:calc(var(--vw)*50 - 1024*var(--h));
    --hy:calc(var(--vh)*100 - 1151*var(--h) - 150*var(--u));
  }
  .letters{--ly:calc(var(--hy) + 430*var(--h) - 300*var(--lh))}
  .bg{background-position:72% center}
  .musician{-webkit-mask:linear-gradient(#000 78%,transparent 99%);mask:linear-gradient(#000 78%,transparent 99%)}
  .logo{left:calc(44*var(--u));top:calc(52*var(--u));width:calc(146.7*var(--u));height:calc(85.7*var(--u))}
  .follow{right:calc(140*var(--u));top:calc(56*var(--u));width:calc(220*var(--u));height:calc(70*var(--u));border-radius:calc(35*var(--u));font-size:calc(26*var(--u))}
  .menu-btn{right:calc(44*var(--u));top:calc(56*var(--u));width:calc(70*var(--u));height:calc(70*var(--u));--bar:calc(24*var(--u));--bo:calc(7*var(--u))}
  .social{right:calc(44*var(--u));top:calc(160*var(--u));gap:calc(30*var(--u))}
  .social a{width:calc(40*var(--u));height:calc(40*var(--u))}
  .card{width:calc(376*var(--u));bottom:calc(44*var(--u));height:calc(190*var(--u));border-radius:calc(28*var(--u))}
  .card.tour{left:calc(44*var(--u))}
  .card.release{right:calc(44*var(--u))}
  .card h2{font-size:calc(27*var(--u));top:calc(24*var(--u))}
  .card p{font-size:calc(22*var(--u));top:calc(62*var(--u))}
  .btn{top:calc(108*var(--u));height:calc(62*var(--u));font-size:calc(22*var(--u))}
}

/* ==========================================================================
   MOBILE (portrait ≤ 33.75em) — the tablet scale would push card text under
   17px and close the card gutter, so the section is re-architected:
   · header: logo ··· menu   (Follow moves into the menu)
   · socials keep their right-edge column, as 44px touch targets
   · the two cards stay a side-by-side pair (desktop's left/right pairing),
     switch to an intrinsic flex layout and set their titles on two lines
   · sizes are fluid (clamp) between narrow and large phones
   ========================================================================== */
@media (orientation:portrait) and (max-width:33.75em){
  .stage{
    --g:clamp(14px,4.4vw,22px);                     /* outer gutter */
    --gap:clamp(8px,2.6vw,12px);                    /* gap between cards */
    --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
    --hdr:calc(max(var(--g), var(--st) + 8px));     /* header top */
    --cw:calc((var(--vw)*100 - 2*var(--g) - var(--gap)) / 2);
    --dock:calc(var(--g) + var(--sb) + clamp(150px,41vw,176px));
    /* hero a touch larger than tablet portrait (height-capped), so tall phones carry less empty headroom */
    --h:min(calc(var(--vw)*100/680), calc(var(--vh)*100/1650));
    --hx:calc(var(--vw)*50 - 1024*var(--h));
    --hy:calc(var(--vh)*100 - 1151*var(--h) - var(--dock)*.42);
  }
  /* hero: lettering lifted into the headroom so the wordmark reads above the head;
     the guitar fades out before the curved labels so they stay legible */
  .letters{--ly:calc(var(--hy) + 330*var(--h) - 300*var(--lh))}
  .musician{-webkit-mask:linear-gradient(#000 60%,transparent 90%);mask:linear-gradient(#000 60%,transparent 90%)}
  /* header */
  .logo{left:var(--g);top:calc(var(--hdr) + (44px - clamp(64px,18vw,82px)*.584)/2);width:clamp(64px,18vw,82px);height:calc(clamp(64px,18vw,82px)*.584)}
  .menu-btn{right:calc(var(--g) - 2px);top:var(--hdr);width:44px;height:44px;--bar:18px;--bo:6px}
  /* Follow joins the menu, below the links, as the same white pill */
  .primary{padding:calc(var(--hdr) + 64px) var(--g) calc(var(--g) + var(--sb))}
  .primary .follow{position:relative;right:auto;top:auto;visibility:inherit;width:clamp(160px,46vw,200px);height:52px;border-radius:26px;font-size:15px;padding-top:1px;
    opacity:0;transform:translateY(10px);transition:opacity .35s var(--ease) .15s,transform .35s var(--ease) .15s}
  .stage.open .primary .follow{opacity:1;transform:none}
  /* socials: same right-edge column, 22px glyphs inside 44px targets */
  .social{right:calc(var(--g) - 11px);top:calc(var(--hdr) + 56px);gap:2px}
  .social a{width:44px;height:44px}
  .social svg{width:22px;height:22px}
  /* cards: a docked pair */
  .card{--cu:calc(var(--cw) / 390);
    bottom:calc(var(--g) + var(--sb));width:var(--cw);height:auto;border-radius:clamp(18px,5vw,24px);
    display:flex;flex-direction:column;align-items:center;padding:clamp(14px,4vw,18px) clamp(8px,3vw,14px) clamp(10px,3vw,14px)}
  .card.tour{left:var(--g)}
  .card.release{right:var(--g)}
  .card h2,.card p,.btn{position:static}
  .card h2{font-size:clamp(14px,4.6vw,19px);line-height:1.18;text-wrap:balance}
  /* two-line titles set by measure, not markup (greedy wrap):
     "Zepp DiverCity," 6.89em < 8.2em < full title 9.81em  → breaks after the comma
     "Solitude" 3.74em  < 5.5em < "Electric Solitude" 7.36em → one word per line */
  .tour h2{max-width:8.2em}
  .release h2{max-width:5.5em}
  .card p{margin-top:4px;font-size:clamp(12px,3.3vw,14px)}
  .btn{margin-top:clamp(10px,3vw,14px);width:100%;height:44px;border-radius:22px;font-size:clamp(12px,3.3vw,14px);padding-top:1px}
  /* arc labels: never below a legible 10px glyph; centred over each card */
  .arc{--as:max(var(--cu), .66px);top:calc(-100*var(--as));left:calc((var(--cw) - 260*var(--as))/2 - 10.5*var(--as))}
  .release .arc{left:calc((var(--cw) - 260*var(--as))/2 - 7.5*var(--as))}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* One opening sequence. The smoke and the image-filled ELSE lettering stay still. */
@media (prefers-reduced-motion:no-preference){
  html.entrance .logo{animation:entry-logo .62s cubic-bezier(.22,1,.36,1) .04s backwards}
  html.entrance .musician{animation:entry-figure 1.04s cubic-bezier(.22,1,.36,1) .16s backwards}
  html.entrance .follow{animation:entry-detail .56s cubic-bezier(.22,1,.36,1) .60s backwards}
  html.entrance .social{animation:entry-detail .54s cubic-bezier(.22,1,.36,1) .82s backwards}
  html.entrance .card.tour{animation:entry-card .76s cubic-bezier(.22,1,.36,1) .86s backwards}
  html.entrance .card.release{animation:entry-card .76s cubic-bezier(.22,1,.36,1) 1.02s backwards}
  html.entrance .tour .btn{animation:entry-detail .48s cubic-bezier(.22,1,.36,1) 1.27s backwards}
  html.entrance .release .btn{animation:entry-detail .48s cubic-bezier(.22,1,.36,1) 1.43s backwards}
  @media (orientation:landscape) and (min-width:50.001em){
    html.entrance .nav li{animation:entry-detail .50s cubic-bezier(.22,1,.36,1) backwards}
    html.entrance .nav li:nth-child(1){animation-delay:.34s}
    html.entrance .nav li:nth-child(2){animation-delay:.39s}
    html.entrance .nav li:nth-child(3){animation-delay:.44s}
    html.entrance .nav li:nth-child(4){animation-delay:.49s}
    html.entrance .nav li:nth-child(5){animation-delay:.54s}
  }
  @media (orientation:portrait), (orientation:landscape) and (max-width:50em){
    html.entrance .menu-btn{animation:entry-detail .52s cubic-bezier(.22,1,.36,1) .47s backwards}
  }
}
@keyframes entry-logo{
  from{opacity:.55;clip-path:inset(0 100% 0 0)}
  to{opacity:1;clip-path:inset(0 0 0 0)}
}
@keyframes entry-figure{
  from{opacity:0;transform:translate3d(0,12px,0)}
  to{opacity:1;transform:none}
}
@keyframes entry-card{
  from{opacity:0;transform:translate3d(0,10px,0)}
  to{opacity:1;transform:none}
}
@keyframes entry-detail{
  from{opacity:0;transform:translate3d(0,5px,0)}
  to{opacity:1;transform:none}
}
</style>
</head>
<body>
<main class="stage" id="stage" style="--letters:url(&quot;assets/letter-mask.svg&quot;)">
  <div class="bg" aria-hidden="true"></div>
  <div class="letters" aria-hidden="true"><i></i><i></i></div>
  <img class="musician" src="assets/musician.webp" alt="ELSE frontman on stage, arms outstretched, holding a microphone with a guitar on his lap">

  <a class="logo" href="#" aria-label="ELSE — home"><img src="assets/logo.webp" alt=""></a>

  <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="primary-nav"><span></span></button>

  <nav class="primary" id="primary-nav" aria-label="Primary">
    <ul class="nav">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Music</a></li>
      <li><a href="#">Tour</a></li>
      <li><a href="#">Store</a></li>
    </ul>
    <a class="follow" href="#">Follow</a>

<script>
(function(){
  var stage=document.getElementById('stage'),btn=document.getElementById('menuBtn'),nav=document.getElementById('primary-nav');
  if(document.documentElement.classList.contains('entrance')){
    var last=document.querySelector('.release .btn'),cleanupTimer;
    function finishEntrance(){clearTimeout(cleanupTimer);document.documentElement.classList.remove('entrance')}
    last.addEventListener('animationend',function(e){if(e.target===last)finishEntrance()},{once:true});
    cleanupTimer=setTimeout(finishEntrance,2400);
  }
  function collapsed(){return getComputedStyle(btn).display!=='none'}
  function focusables(){return [btn].concat([].slice.call(nav.querySelectorAll('a'))).filter(function(el){return el.offsetParent!==null||getComputedStyle(el).position==='absolute'})}
  function setOpen(open,returnFocus){
    stage.classList.toggle('open',open);
    btn.setAttribute('aria-expanded',open);
    btn.setAttribute('aria-label',open?'Close menu':'Open menu');
    if(open){var f=nav.querySelector('.nav a');setTimeout(function(){f&&f.focus({preventScroll:true})},60)}
    else if(returnFocus){btn.focus({preventScroll:true})}
  }
  btn.addEventListener('click',function(){setOpen(!stage.classList.contains('open'),true)});
  nav.addEventListener('click',function(e){if(e.target.closest('a')&&stage.classList.contains('open'))setOpen(false,false)});
  document.addEventListener('keydown',function(e){
    if(!stage.classList.contains('open'))return;
    if(e.key==='Escape'){setOpen(false,true);return}
    if(e.key==='Tab'){ /* keep focus inside the open menu */
      var f=focusables(),first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
    }
  });
  /* returning to a wide layout while open: reset the state */
  addEventListener('resize',function(){if(!collapsed()&&stage.classList.contains('open'))setOpen(false,false)});
  /* iOS Safari fallback where dvh is unsupported: track the real inner height */
  if(!(window.CSS&&CSS.supports('height','1dvh'))){var f=function(){document.documentElement.style.setProperty('--vh',innerHeight/100+'px')};f();addEventListener('resize',f);}
})();
</script>
