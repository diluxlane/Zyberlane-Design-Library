  .btn-social,.btn-social.g,.btn-social.a{width:100%;height:clamp(44px,6dvh,48px);margin:0;padding:0 6px;gap:7px;border-width:1.5px;border-radius:10px;font-size:14px;white-space:nowrap}
  .btn-social svg,.btn-social.g svg,.btn-social.a svg{width:20px;height:20px;top:0}
  .btn-social.a svg{width:17px;height:21px}
  .social-prefix{display:none}
  .signup{margin-top:clamp(12px,2dvh,24px);font-size:14px}
  .signup a{text-decoration-thickness:1px;text-underline-offset:3px}
  .foot{position:static;align-self:stretch;flex:none;font-size:12.5px;line-height:1.1}
  .foot span{gap:5px}
  .foot svg{width:15px;height:15px}
  .panel{display:none}
}

/* Compact phones: preserve the full form without shrinking tap targets. */
@media (max-width:699px) and (max-height:600px){
  .brand-mark{width:29px;height:29px}
  .brand-name{font-size:20px}
  .form-wrap{padding:0}
  .title{font-size:28px}
  .subtitle{font-size:13px;line-height:1.25;margin-top:5px}
  .fields{margin-top:10px}
  .field + .field{margin-top:8px}
  .label{margin-bottom:4px}
  .input,.input.pw{height:44px}
  .btn-primary{height:44px;margin-top:9px}
  .divider{margin-top:10px}
  .social-actions{margin-top:9px}
  .btn-social,.btn-social.g,.btn-social.a{height:44px}
  .signup{margin-top:10px}
}

/* Short landscape screens use the horizontal space for the full login. */
@media (min-width:600px) and (max-height:580px){
  :root{--u:1px}
  .screen{display:block;width:100%;height:100dvh;min-height:0;overflow:hidden}
  .left{position:relative;inset:auto;width:100%;height:100%;min-height:0;display:flex;flex-direction:column;align-items:center;padding:10px clamp(18px,4vw,38px)}
  .brand{position:static;align-self:flex-start;gap:8px;flex:none}
  .brand-mark{width:28px;height:28px;border-radius:7px}
  .brand-mark svg{width:19px;height:19px}
  .brand-name{font-size:19px}
  .form-wrap{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:'title divider' 'subtitle socials' 'form socials' 'form signup';column-gap:clamp(24px,5vw,64px);width:min(100%,920px);max-width:none;min-width:0;margin:auto 0;padding:0}
  .title{grid-area:title;text-align:left;font-size:clamp(25px,3vw,32px);white-space:normal}
  .subtitle{grid-area:subtitle;text-align:left;margin:4px 0 0;font-size:13px;line-height:1.2;white-space:normal}
  .form-wrap form{grid-area:form}
  .fields{margin-top:10px}
  .field + .field{margin-top:8px}
  .label{font-size:12.5px;margin-bottom:4px}
  .input,.input.pw{height:43px;border-width:1.5px;border-radius:9px}
  .input input,.input.pw input.shown{font-size:16px;padding:0 12px}
  .input.pw input:not(.shown){font-size:24px;letter-spacing:2px;padding-left:12px;padding-right:46px}
  .eye{right:2px;width:40px;height:40px}
  .eye svg{width:19px;height:20px}
  .forgot{margin-top:2px;padding:2px 0;font-size:12.5px}
  .btn-primary{height:43px;margin-top:8px;padding:0;border-radius:9px;font-size:16px}
  .divider{grid-area:divider;margin:0;align-self:center;font-size:14px}
  .social-actions{grid-area:socials;display:flex;flex-direction:column;gap:8px;margin:12px 0 0}
  .btn-social,.btn-social.g,.btn-social.a{width:100%;height:43px;margin:0;padding:0 8px;gap:8px;border-width:1.5px;border-radius:9px;font-size:14px}
  .btn-social svg,.btn-social.g svg,.btn-social.a svg{width:19px;height:19px;top:0}
  .social-prefix{display:inline}
  .signup{grid-area:signup;margin:12px 0 0;text-align:left;font-size:13.5px}
  .foot{position:static;align-self:stretch;flex:none;font-size:12px}
  .foot span{gap:5px}
  .foot svg{width:14px;height:14px}
  .panel{display:none}
}

/* The keyboard or extreme zoom can reduce the viewport below the form's
   physical minimum. Keep controls reachable without a visible scrollbar. */
@media (max-height:440px) and (max-width:599px), (max-height:340px) and (max-width:1132px){
  .left{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
  .left::-webkit-scrollbar{display:none}
  .form-wrap{margin:8px 0}
  .foot{margin-top:auto}
}

/* Keyboard users need a visible target on every action. */
:where(button,a,textarea):focus-visible{outline:3px solid #a88bff;outline-offset:3px}
.panel :where(button,textarea):focus-visible{outline-color:#fff}

/* One opening timeline. The blue panel background never animates. Each
   animation uses backwards fill only, so the final frame is authored CSS. */
@keyframes entry-rise{
  from{opacity:0;transform:translate3d(0,var(--entry-offset,8px),0)}
  to{opacity:1;transform:none}
}
@keyframes entry-type{
  from{opacity:0;clip-path:inset(0 0 100% 0);transform:translate3d(0,12px,0)}
  to{opacity:1;clip-path:inset(0);transform:none}
}
@keyframes entry-interface{
  from{opacity:0;transform:translate3d(0,10px,0) scale(.988)}
  to{opacity:1;transform:none}
}
@keyframes entry-quiet{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:no-preference){
  .entry-intro :is(.brand,.title,.subtitle,.fields,.forgot,.btn-primary,.divider,.social-actions,.signup,.foot,.ask,.chips,.prompt){
    animation-timing-function:cubic-bezier(.22,1,.36,1);
    animation-fill-mode:backwards;
    animation-iteration-count:1;
  }
  .entry-intro .brand{--entry-offset:6px;animation-name:entry-rise;animation-duration:.52s;animation-delay:.02s}
  .entry-intro .title{animation-name:entry-type;animation-duration:.72s;animation-delay:.16s}
  .entry-intro .subtitle{--entry-offset:7px;animation-name:entry-rise;animation-duration:.50s;animation-delay:.38s}
  .entry-intro .fields{--entry-offset:10px;animation-name:entry-rise;animation-duration:.60s;animation-delay:.49s}
  .entry-intro .forgot{animation-name:entry-quiet;animation-duration:.38s;animation-delay:.65s}
  .entry-intro .btn-primary{--entry-offset:6px;animation-name:entry-rise;animation-duration:.54s;animation-delay:.73s}
  .entry-intro .divider{animation-name:entry-quiet;animation-duration:.40s;animation-delay:.84s}
  .entry-intro .social-actions{--entry-offset:7px;animation-name:entry-rise;animation-duration:.52s;animation-delay:.91s}
  .entry-intro .signup{animation-name:entry-quiet;animation-duration:.42s;animation-delay:1.10s}
  .entry-intro .foot{animation-name:entry-quiet;animation-duration:.42s;animation-delay:1.20s}
  .entry-intro .ask{--entry-offset:9px;animation-name:entry-rise;animation-duration:.65s;animation-delay:.70s}
  .entry-intro .chips{--entry-offset:7px;animation-name:entry-rise;animation-duration:.52s;animation-delay:.94s}
  .entry-intro .prompt{animation-name:entry-interface;animation-duration:.72s;animation-delay:1.05s}
}

/* ---- touch devices: hover styles would stick after a tap, so the same
   feedback moves to :active; mouse users keep the desktop hover ---- */
@media (hover: none){
  .chip:hover{background:linear-gradient(180deg,rgba(78,80,100,.34),rgba(66,68,88,.26));border-color:rgba(255,255,255,.24)}
  .pill:hover{background:linear-gradient(180deg,rgba(80,82,96,.24),rgba(72,74,90,.18))}
  .btn-social:hover{background:#fafafa}
  .btn-primary:hover{filter:none}
  .send:hover{transform:none}
  .chip:active{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3)}
  .pill:active{background:rgba(255,255,255,.13)}
  .btn-social:active{background:#f3f3f5}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="screen">
  <section class="left">
    <a class="brand" href="#" aria-label="Voicelab.AI home">
      <span class="brand-mark">
        <svg viewBox="0 0 30 30" fill="#fff" aria-hidden="true">
          <path d="M13.2 4.5c.55 4.6 3.05 7.45 7.6 8.15-4.55.7-7.05 3.55-7.6 8.15-.55-4.6-3.05-7.45-7.6-8.15 4.55-.7 7.05-3.55 7.6-8.15z" transform="translate(1.4 2.3)"/>

            <span class="input pw">

                <svg viewBox="0 0 24 24" fill="none" stroke="#0b0c10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2.5 11.5C4.6 7.9 8 6 12 6s7.4 1.9 9.5 5.5"/><path d="M2.5 12.5C4.6 16.1 8 18 12 18s7.4-1.9 9.5-5.5"/>
                  <circle cx="12" cy="12" r="3"/><path d="M4 20 20 4"/>

      <div class="divider">Or Login With</div>

          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>

          <span><span class="social-prefix">Continue with </span>Apple</span>

  </section>

  <section class="panel" aria-label="AI Builder">

</main>
<script>
  // Finish on interaction or resize so the entrance never blocks the form or
  // replays across layouts. Backwards fill makes failed cleanup harmless.
  (() => {
    const root = document.documentElement;
    if (root.classList.contains('entry-intro')) {
      let timeout;
      const finish = () => {
        root.classList.remove('entry-intro');
        window.removeEventListener('pointerdown', finish);
        window.removeEventListener('keydown', finish);
        window.removeEventListener('resize', finish);
        document.removeEventListener('visibilitychange', finish);
        window.clearTimeout(timeout);
      };
      window.addEventListener('pointerdown', finish, {once:true});
      window.addEventListener('keydown', finish, {once:true});
      window.addEventListener('resize', finish, {once:true});
      document.addEventListener('visibilitychange', finish, {once:true});
      timeout = window.setTimeout(finish, 2050);
    }
  })();
</script>
